<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音乐信札 Classic</title>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap"></noscript>
<style>
:root{--bg:#fff;--bg2:#f7f7f7;--bg3:#efefef;--line:#e0e0e0;--t1:#101010;--t2:#444;--t3:#8a8a8a;--mono:'IBM Plex Mono','SFMono-Regular',Menlo,monospace;--serif:'Noto Serif SC','Songti SC','STSong',serif;--sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:linear-gradient(180deg,#fbfbfb,#f2f2f2 45%,#ececec);color:var(--t1);min-height:100vh}
button,input,textarea{font:inherit}
.shell{max-width:1180px;margin:0 auto;padding:24px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:8px 0 20px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif);font-size:28px;font-weight:700;letter-spacing:.03em}
.sub{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--t3);margin-top:6px}
.meta{font-size:12px;color:var(--t3);max-width:420px;line-height:1.8}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;margin-top:24px}
.panel{background:rgba(255,255,255,.88);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.06);backdrop-filter:blur(10px)}
.sidebar{padding:18px}
.section-kicker{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);margin-bottom:12px}
.agent-list{display:flex;flex-direction:column;gap:10px}
.agent{width:100%;text-align:left;border:1px solid var(--line);background:#fff;padding:12px;border-radius:4px;cursor:pointer;transition:.15s}
.agent:hover,.agent.active{border-color:var(--t1);background:var(--bg2)}
.agent-head{display:flex;align-items:center;gap:10px}
.avatar{width:40px;height:40px;border-radius:50%;border:1px solid var(--t1);background:#111 center 18%/cover no-repeat;box-shadow:0 0 0 3px #fff}
.agent-name{font-family:var(--serif);font-size:18px;font-weight:700}
.agent-era{font-size:11px;color:var(--t3);margin-top:2px}
.agent-note{margin-top:10px;font-size:12px;color:var(--t2);line-height:1.7}
.agent-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-family:var(--mono);font-size:10px;border:1px solid var(--line);padding:2px 6px;border-radius:999px;color:var(--t3);background:var(--bg2)}
.main{padding:22px}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) 290px;gap:18px}
.hero-copy h1{font-family:var(--serif);font-size:34px;line-height:1.2}
.hero-copy p{font-size:13px;color:var(--t2);line-height:1.9;margin-top:10px;max-width:620px}
.hero-card{padding:16px;border:1px solid var(--line);background:linear-gradient(180deg,#fff,#f6f6f6)}
.hero-card .label,.card .label,.msg-meta,.progress{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3)}
.hero-card .value{font-family:var(--serif);font-size:22px;font-weight:700;margin-top:10px}
.hero-card .hint{font-size:12px;color:var(--t2);line-height:1.8;margin-top:10px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.btn{height:36px;padding:0 14px;border:1px solid var(--line);background:#fff;color:var(--t2);cursor:pointer;border-radius:3px}
.btn:hover{border-color:var(--t1);color:var(--t1)}
.btn.solid{background:var(--t1);color:#fff;border-color:var(--t1)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.board{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;margin-top:20px}
.card{padding:16px;border:1px solid var(--line);background:#fff;min-height:320px;display:flex;flex-direction:column}
.year{font-family:var(--serif);font-size:44px;font-weight:700;line-height:1}
.period{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.5;margin-top:10px}
.event{font-size:13px;line-height:1.8;color:var(--t2);margin-top:10px}
.work{font-size:12px;color:var(--t3);line-height:1.7;margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.chat{border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;min-height:420px}
.feed{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.msg{font-size:13px;line-height:1.8}
.msg.agent{border-left:2px solid #111;padding-left:12px}
.msg.user{align-self:flex-end;max-width:78%;background:#111;color:#fff;padding:9px 11px;border-radius:3px}
.msg.user .msg-meta{color:rgba(255,255,255,.58)}
.composer{border-top:1px solid var(--line);padding:12px}
.composer textarea{width:100%;min-height:92px;border:1px solid var(--line);padding:10px;border-radius:3px;resize:vertical;outline:none;background:#fff}
.composer textarea:focus{border-color:var(--t1)}
.composer-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.composer-tip{font-size:12px;color:var(--t3)}
.empty{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--t3);font-size:13px;line-height:1.9;height:100%}
@media (max-width: 920px){
  .layout,.hero,.board{grid-template-columns:1fr}
  .shell{padding:14px}
}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div>
      <div class="brand">音乐信札 Classic</div>
      <div class="sub">one card, one letter, one reply</div>
    </div>
    <div class="meta">从现有“智能体也”界面里抽出最小骨架。每一局只做一件事：在不能改写历史的前提下，和一位音乐家短暂通信。</div>
  </div>

  <div class="layout">
    <aside class="panel sidebar">
      <div class="section-kicker">Agents</div>
      <div class="agent-list" id="agent-list"></div>
    </aside>

    <main class="panel main">
      <section class="hero">
        <div class="hero-copy">
          <div class="section-kicker">Classic Loop</div>
          <h1 id="hero-name">莫扎特</h1>
          <p id="hero-copy"></p>
          <div class="controls">
            <button class="btn solid" id="draw-btn">抽命运卡牌</button>
            <button class="btn" id="reset-btn">重开这条时间线</button>
          </div>
        </div>
        <div class="hero-card">
          <div class="label">Progress</div>
          <div class="value" id="progress-value">0 / 3</div>
          <div class="hint" id="progress-copy">先抽一张牌。每张牌只允许寄出一封短信。</div>
        </div>
      </section>

      <section class="board">
        <div class="card" id="fate-card">
          <div class="empty">先选一位音乐家，然后抽一张命运卡牌。</div>
        </div>

        <div class="chat">
          <div class="feed" id="feed"></div>
          <div class="composer">
            <textarea id="message-input" placeholder="写一句给他的短信。不要试图拯救历史，只要推动一个停顿。"></textarea>
            <div class="composer-row">
              <div class="composer-tip" id="composer-tip">尚未抽卡。</div>
              <button class="btn solid" id="send-btn" disabled>寄出信札</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>

<script>
const DATA = {
  mozart: {
    name: '莫扎特',
    era: '古典主义 · 维也纳',
    avatar: '/assets/mozart-avatar.png',
    intro: '明亮、锋利、欠账也欠睡眠。适合谈自由、剧院、书信和体面。',
    tags: ['歌剧', '书信', '自由职业'],
    opening: '问题不必太大。写得准一点，历史才会稍微偏一下。',
    cards: [
      { year: '1778', period: '巴黎之夜', event: '母亲死在巴黎，他把噩耗折进信里。', work: 'Piano Sonata No.8 in A minor, K.310' },
      { year: '1781', period: '离开宫廷', event: '他终于离开萨尔茨堡，代价是失去庇护。', work: 'Idomeneo, K.366' },
      { year: '1786', period: '费加罗之门', event: '他让仆人唱出贵族不愿听见的话。', work: 'Le nozze di Figaro, K.492' }
    ]
  },
  beethoven: {
    name: '贝多芬',
    era: '古典主义到浪漫主义 · 维也纳',
    avatar: '/assets/beethoven-avatar.png',
    intro: '粗粝、克制、对“命运”这两个字过于熟悉。适合谈耳聋、野心和不肯低头。',
    tags: ['交响曲', '命运', '耳聋'],
    opening: '别安慰我。写事实，或者写你愿意陪我听见什么。',
    cards: [
      { year: '1802', period: '海利根施塔特', event: '他写下遗书，却选择活着。', work: 'Heiligenstadt Testament' },
      { year: '1808', period: '寒夜交响曲', event: '命运从不敲门，只会重锤。', work: 'Symphony No.5, Op.67' },
      { year: '1824', period: '合唱响起', event: '他听不见掌声，只看见众人回头。', work: 'Symphony No.9, Op.125' }
    ]
  }
};

const state = {
  currentId: 'mozart',
  session: loadSession()
};

function loadSession() {
  try {
    const raw = JSON.parse(localStorage.getItem('music-letter-classic') || '{}');
    return raw && typeof raw === 'object' ? raw : {};
  } catch {
    return {};
  }
}

function saveSession() {
  localStorage.setItem('music-letter-classic', JSON.stringify(state.session));
}

function currentSession() {
  if (!state.session[state.currentId]) {
    state.session[state.currentId] = { deck: [], currentCard: null, history: [] };
  }
  return state.session[state.currentId];
}

function shuffle(list) {
  const copy = list.slice();
  for (let i = copy.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function ensureDeck() {
  const session = currentSession();
  const cards = DATA[state.currentId].cards;
  if (!Array.isArray(session.deck) || !session.deck.length) {
    session.deck = shuffle(cards.map((card, index) => ({ ...card, index })));
  }
}

function esc(text) {
  return String(text || '').replace(/[&<>"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[char]));
}

function renderAgents() {
  const box = document.getElementById('agent-list');
  box.innerHTML = Object.entries(DATA).map(([id, item]) => {
    const active = id === state.currentId ? 'active' : '';
    const tags = item.tags.map(tag => `<span class="tag">${esc(tag)}</span>`).join('');
    return `<button class="agent ${active}" data-id="${id}">
      <div class="agent-head">
        <div class="avatar" style="background-image:url('${item.avatar}')"></div>
        <div>
          <div class="agent-name">${item.name}</div>
          <div class="agent-era">${item.era}</div>
        </div>
      </div>
      <div class="agent-note">${item.intro}</div>
      <div class="agent-tags">${tags}</div>
    </button>`;
  }).join('');
}

function renderHero() {
  const item = DATA[state.currentId];
  const session = currentSession();
  const finished = item.cards.length - (session.deck || []).length;
  document.getElementById('hero-name').textContent = item.name;
  document.getElementById('hero-copy').textContent = item.opening;
  document.getElementById('progress-value').textContent = `${finished} / ${item.cards.length}`;
  document.getElementById('progress-copy').textContent = session.currentCard
    ? `当前停在 ${session.currentCard.year} · ${session.currentCard.period}。写完这封，再翻下一页。`
    : '先抽一张牌。每张牌只允许寄出一封短信。';
}

function renderCard() {
  const card = currentSession().currentCard;
  const node = document.getElementById('fate-card');
  if (!card) {
    node.innerHTML = '<div class="empty">先选一位音乐家，然后抽一张命运卡牌。</div>';
    return;
  }
  node.innerHTML = `<div class="label">Fate Card</div>
    <div class="year">${esc(card.year)}</div>
    <div class="period">${esc(card.period)}</div>
    <div class="event">${esc(card.event)}</div>
    <div class="work">对应作品：${esc(card.work)}</div>`;
}

function renderFeed() {
  const item = DATA[state.currentId];
  const history = currentSession().history || [];
  const feed = document.getElementById('feed');
  if (!history.length) {
    feed.innerHTML = `<div class="empty">${esc(item.opening)}</div>`;
    return;
  }
  feed.innerHTML = history.map(msg => {
    if (msg.role === 'user') {
      return `<div class="msg user"><div class="msg-meta">你</div><div>${esc(msg.text)}</div></div>`;
    }
    return `<div class="msg agent"><div class="msg-meta">${esc(item.name)}</div><div>${esc(msg.text)}</div></div>`;
  }).join('');
  feed.scrollTop = feed.scrollHeight;
}

function updateComposer() {
  const session = currentSession();
  const input = document.getElementById('message-input');
  const send = document.getElementById('send-btn');
  const draw = document.getElementById('draw-btn');
  const done = !session.deck.length && !session.currentCard;
  send.disabled = !session.currentCard;
  draw.disabled = !!session.currentCard || done;
  document.getElementById('composer-tip').textContent = done
    ? '这条时间线结束了。可以重开，或换一位音乐家。'
    : session.currentCard
      ? `写给 ${session.currentCard.year} 年的这一页。`
      : '尚未抽卡。';
  if (!session.currentCard) {
    input.value = '';
  }
}

function selectAgent(id) {
  state.currentId = id;
  ensureDeck();
  render();
  saveSession();
}

function drawCard() {
  const session = currentSession();
  if (session.currentCard) return;
  ensureDeck();
  session.currentCard = session.deck.shift() || null;
  saveSession();
  render();
}

function keywordHit(text, words) {
  return words.find(word => text.includes(word));
}

function buildReply(agent, card, text) {
  const lower = text.replace(/\s+/g, '');
  const comfort = keywordHit(lower, ['别怕', '陪你', '理解', '辛苦', '难过', '孤独']);
  const future = keywordHit(lower, ['未来', '结局', '后来', '会不会', '死亡']);
  const music = keywordHit(lower, ['作品', '音乐', '交响曲', '歌剧', '钢琴', '旋律']);

  if (agent === 'mozart') {
    if (future) return `你问得太远了。\n我只能告诉你，${card.year}年的桌上还有账单、墨水和一点没写完的和声。\n你的话没有救谁，却让我把原本要撕掉的纸重新压平。`;
    if (comfort) return `安慰像酒，刚入口时暖，醒来仍旧要付账。\n但你的句子留在了手边，我写${card.work}时，少了一次暴躁的停顿。\n旁边的抄谱员因此没漏掉那一行。`;
    if (music) return `音乐不是天上掉下来的体面。\n它常常先落在鞋底、旅馆、剧院后台和没结清的钱上。\n你既然肯问这个，我就愿意把${card.work}那层亮光后面的灰也给你看。`;
    return `你的信落在${card.year}年的桌上。\n${card.period}还没有过去，我手边只有${card.work}、一截烛泪和没说完的话。\n你没有改写历史，只把我本来想忍下去的一口气，稍微说出来了一点。`;
  }

  if (future) return `别替我看结局。\n此刻只有${card.work}，还有这副正在学会沉默的身体。\n你那句话没有推开命运，只让我把拳头放松了一瞬。`;
  if (comfort) return `安慰若是空的，我一听就知道。\n但你写得不空，所以它像一只手按在谱纸边上，让我没把这一页揉掉。\n这已经够了。`;
  if (music) return `你若只听见“命运”，那还不够。\n真正难的是把痛苦整理成能被别人重复的形式。\n${card.work}不是宣言，它只是我拒绝低头时留下的证据。`;
  return `你的信来得不算迟。\n我正站在${card.period}里，桌上的${card.work}还带着硬边。\n历史不会因为你改道，但我会记住，曾有人在这一页替我把灯拨亮了一点。`;
}

function sendLetter() {
  const session = currentSession();
  const input = document.getElementById('message-input');
  const text = input.value.trim();
  if (!session.currentCard || !text) return;
  session.history.push({ role: 'user', text });
  session.history.push({ role: 'agent', text: buildReply(state.currentId, session.currentCard, text) });
  session.currentCard = null;
  saveSession();
  render();
}

function resetTimeline() {
  state.session[state.currentId] = { deck: shuffle(DATA[state.currentId].cards.map((card, index) => ({ ...card, index }))), currentCard: null, history: [] };
  saveSession();
  render();
}

function render() {
  ensureDeck();
  renderAgents();
  renderHero();
  renderCard();
  renderFeed();
  updateComposer();
}

document.getElementById('agent-list').addEventListener('click', event => {
  const button = event.target.closest('.agent');
  if (!button) return;
  selectAgent(button.dataset.id);
});
document.getElementById('draw-btn').addEventListener('click', drawCard);
document.getElementById('send-btn').addEventListener('click', sendLetter);
document.getElementById('reset-btn').addEventListener('click', resetTimeline);
document.getElementById('message-input').addEventListener('keydown', event => {
  if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') sendLetter();
});

render();
</script>
</body>
</html>
