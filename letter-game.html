<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音乐信札 · 时空列车</title>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap"></noscript>
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"></noscript>
<style>

:root{--gold:#d7b66a;--gold2:#8c6a2f;--ink:#0a0806;--paper:#f1e5c8;--mono:'IBM Plex Mono','SFMono-Regular',Menlo,monospace;--serif:'Noto Serif SC','Songti SC','STSong',serif;--sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#0b0705;color:#f5ecd5;font-family:var(--sans)}
.train-home{position:relative;width:100vw;height:100vh;isolation:isolate;background:#0b0705;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:0}
.stage-frame{position:relative;aspect-ratio:4/3;width:min(100vw,calc(100vh * 4 / 3));height:auto;max-width:100%;max-height:100%;overflow:hidden;background:#0b0705;box-shadow:0 34px 120px rgba(0,0,0,.72),inset 0 0 0 1px rgba(215,182,106,.12)}
.stage-frame:before{content:'';position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.42) 82%,rgba(0,0,0,.76) 100%);pointer-events:none}
.stage-frame:after{content:'';position:absolute;inset:0;z-index:2;background:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px);mix-blend-mode:screen;opacity:.14;pointer-events:none}
.scene-wrap{--scene-base:translateY(-50%);position:absolute;left:0;right:0;top:50%;width:100%;aspect-ratio:3/2;height:auto;transform:var(--scene-base);animation:trainSway 7.5s ease-in-out infinite;transform-origin:50% 58%;will-change:transform;overflow:visible;transition:filter .2s ease,transform .2s ease}
.scene-wrap.is-leaving{filter:brightness(.72) saturate(.92);transform:var(--scene-base) scale(.994)}
.scene-image{position:absolute;inset:0;z-index:0;background-image:url('assets/victorian-train-home.jpg');background-size:contain;background-position:center;background-repeat:no-repeat;background-color:#0b0705;filter:saturate(1.03) contrast(1.06) brightness(.98)}
.scene-wrap:after{content:'';position:absolute;inset:0;z-index:4;background:radial-gradient(circle at 62% 42%,rgba(255,196,104,.08),transparent 24%),linear-gradient(90deg,rgba(0,0,0,.34) 0%,rgba(0,0,0,.04) 25%,rgba(0,0,0,.02) 55%,rgba(0,0,0,.18) 82%,rgba(0,0,0,.36) 100%),linear-gradient(180deg,rgba(0,0,0,.08),transparent 44%,rgba(0,0,0,.20));pointer-events:none}
@keyframes trainSway{0%,100%{transform:var(--scene-base) translate3d(0,0,0) rotate(0deg)}20%{transform:var(--scene-base) translate3d(.16%,-.12%,0) rotate(.06deg)}47%{transform:var(--scene-base) translate3d(-.14%,.10%,0) rotate(-.05deg)}73%{transform:var(--scene-base) translate3d(.08%,.14%,0) rotate(.04deg)}}
.hotspot{position:absolute;z-index:8;display:block;border:1px solid rgba(215,182,106,.015);border-radius:12px;text-decoration:none;cursor:pointer;background:transparent;transition:border-color .18s,box-shadow .18s,background .18s,transform .18s,filter .18s}.hotspot:hover,.hotspot:focus-visible{outline:none;border-color:rgba(246,217,145,.88);background:rgba(215,182,106,.055);box-shadow:0 0 0 1px rgba(215,182,106,.30),0 0 26px rgba(215,182,106,.24),inset 0 0 36px rgba(215,182,106,.055);filter:brightness(1.09);transform:translateY(-1px)}.hotspot:after{content:attr(data-label);position:absolute;left:50%;bottom:100%;transform:translate(-50%,-10px);white-space:nowrap;padding:7px 10px;border:1px solid rgba(215,182,106,.48);border-radius:4px;background:rgba(9,7,4,.82);color:#f5df9e;font-family:var(--serif);font-size:13px;letter-spacing:.06em;opacity:0;pointer-events:none;transition:.18s;box-shadow:0 8px 22px rgba(0,0,0,.28)}.hotspot:hover:after,.hotspot:focus-visible:after{opacity:1;transform:translate(-50%,-14px)}
.hot-archive{left:12.2%;top:3.4%;width:17.1%;height:31.2%}.hot-gr{left:20.8%;top:50.8%;width:15.4%;height:24.1%}.hot-write{left:48.8%;top:43.6%;width:25.4%;height:31.4%;z-index:10}.hot-events{left:44.8%;top:74%;width:24.2%;height:14.5%}.hot-letters{left:69.4%;top:57%;width:10.8%;height:31%}.hot-final{left:81.2%;top:75.2%;width:16.2%;height:16.8%}.hot-time{left:63.2%;top:78%;width:12.3%;height:13.4%}
.typewriter-glint{position:absolute;z-index:5;left:51.4%;top:58.3%;width:17.6%;height:8.8%;pointer-events:none;opacity:0;background:linear-gradient(110deg,transparent 12%,rgba(255,222,151,.28) 48%,transparent 74%);mix-blend-mode:screen;filter:blur(.6px);transition:opacity .18s}.scene-wrap:has(.hot-write:hover) .typewriter-glint{opacity:.58}
.gr-drawer{position:absolute;z-index:14;left:21.8%;top:44%;width:25.5%;min-height:22%;padding:18px 18px 16px;border:1px solid rgba(215,182,106,.34);border-radius:8px;background:linear-gradient(145deg,rgba(20,13,8,.91),rgba(8,6,4,.84));box-shadow:0 24px 70px rgba(0,0,0,.52),inset 0 0 0 1px rgba(255,226,164,.045);color:#ead8ad;font-family:var(--serif);opacity:0;transform:translateY(10px) scale(.985);pointer-events:none;transition:.2s}.gr-drawer.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}.gr-drawer h2{font-size:18px;letter-spacing:.12em;margin-bottom:10px;color:#f4df9a}.gr-drawer p{font-size:14px;line-height:1.8;color:#d9c89c}.gr-drawer form{display:flex;gap:8px;margin-top:14px}.gr-drawer input{flex:1;min-width:0;border:1px solid rgba(215,182,106,.28);border-radius:4px;background:rgba(255,245,218,.06);color:#f5ecd5;padding:9px 10px;font-family:var(--serif);outline:none}.gr-drawer input:focus{border-color:rgba(246,217,145,.7)}.gr-drawer button{border:1px solid rgba(215,182,106,.38);border-radius:4px;background:rgba(215,182,106,.10);color:#f5df9e;padding:0 12px;font-family:var(--serif);cursor:pointer}.gr-close{position:absolute;right:8px;top:6px;width:26px;height:26px}
.dev-door{position:absolute;left:.7%;bottom:.8%;z-index:21;width:2.2%;aspect-ratio:1;border:0;background:transparent;opacity:0;cursor:default}.dev-door:focus-visible{opacity:1;outline:1px solid rgba(215,182,106,.35)}
@media(max-width:760px){.train-home{padding:0}.stage-frame{width:100vw;height:100vh;aspect-ratio:auto}.scene-wrap{--scene-base:translate(-50%,-50%);left:50%;right:auto;top:50%;width:150vh;min-width:100vw;max-width:none;aspect-ratio:3/2;height:auto;animation:trainSway 8s ease-in-out infinite}.scene-image{background-size:contain}.gr-drawer{left:27%;top:39%;width:38%;min-height:26%}.stage-frame:before{background:linear-gradient(180deg,rgba(0,0,0,.50),rgba(0,0,0,.10) 44%,rgba(0,0,0,.68))}}

</style>
</head>
<body>
<main class="train-home" aria-label="音乐信札时空列车主界面">
  <div class="stage-frame">
    <div class="scene-wrap">
      <div class="scene-image"></div>
      <div class="typewriter-glint" aria-hidden="true"></div>
      <a class="hotspot hot-archive" data-label="时空档案袋" aria-label="左上角乐谱画框 时空档案袋" href="/music"></a>
      <button class="hotspot hot-gr" data-label="GR小姐" aria-label="GR机器人 打开GR小姐聊天框" onclick="openGrDrawer(event)"></button>
      <a class="hotspot hot-write" data-label="与音乐家对话" aria-label="打字机 与当前音乐家对话" href="/write"></a>
      <a class="hotspot hot-events" data-label="人生大事" aria-label="火漆信封 人生大事" href="/timeline"></a>
      <a class="hotspot hot-letters" data-label="旅行信札" aria-label="羽毛笔与墨水瓶 旅行信札" href="/letters"></a>
      <a class="hotspot hot-final" data-label="最后的来信" aria-label="绝密信件 最后的来信" href="/letter-room"></a>
      <a class="hotspot hot-time" data-label="滴答回溯" aria-label="桌面怀表 滴答回溯" href="/timeline"></a>
      <aside class="gr-drawer" id="grDrawer" aria-label="GR小姐聊天框">
        <button class="gr-close" type="button" aria-label="关闭GR小姐聊天框" onclick="closeGrDrawer(event)">×</button>
        <h2>GR小姐</h2>
        <p id="grLine">我在。先别急着解释整段命运，只告诉我，你听见了哪一个声音。</p>
        <form onsubmit="sendGrWhisper(event)">
          <input name="gr" autocomplete="off" placeholder="轻声告诉她..." aria-label="给GR小姐留言">
          <button type="submit">递出</button>
        </form>
      </aside>
      <a class="dev-door" href="/classic" aria-label="隐藏开发入口"></a>
    </div>
  </div>
</main>
<script>
const sceneWrap=document.querySelector('.scene-wrap');
function playSceneTap(){
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    const ctx=window.__letterTapCtx||(window.__letterTapCtx=new Ctx());
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(220,ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(110,ctx.currentTime+.12);
    gain.gain.setValueAtTime(.0001,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.045,ctx.currentTime+.015);
    gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.16);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime+.18);
  }catch(e){}
}
function openGrDrawer(event){
  event?.preventDefault();
  playSceneTap();
  document.getElementById('grDrawer')?.classList.add('open');
}
function closeGrDrawer(event){
  event?.preventDefault();
  document.getElementById('grDrawer')?.classList.remove('open');
}
function sendGrWhisper(event){
  event.preventDefault();
  const input=event.currentTarget.elements.gr;
  const text=input.value.trim();
  if(!text)return;
  playSceneTap();
  document.getElementById('grLine').textContent='我收到了。等列车穿过下一段雨声，我会把这句话夹进信纸里。';
  input.value='';
}
document.querySelectorAll('a.hotspot').forEach(link=>{
  link.addEventListener('click',event=>{
    if(event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;
    const href=link.getAttribute('href');
    if(!href||href==='#')return;
    event.preventDefault();
    playSceneTap();
    sceneWrap?.classList.add('is-leaving');
    window.setTimeout(()=>{window.location.href=href},190);
  });
});
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeGrDrawer(event)});
</script>
</body>
</html>
