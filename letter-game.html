<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音乐信札 · 智能体游戏</title>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap"></noscript>
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"></noscript>
<style>

:root{--bg:#fff;--bg2:#f7f7f7;--bg3:#f0f0f0;--line:#e0e0e0;--line2:#c8c8c8;--t1:#0a0a0a;--t2:#444;--t3:#888;--t4:#bbb;--ok:#1a7a3c;--warn:#b7860b;--danger:#c0392b;--info:#1a5fa0;--sw:220px;--th:48px;--serif:'Noto Serif SC','Songti SC','STSong',serif;--sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif;--mono:'IBM Plex Mono','SFMono-Regular',Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--t1);font-size:13px;line-height:1.5}
.topbar{height:var(--th);position:fixed;top:0;left:0;right:0;z-index:200;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:12px}
.logo{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.02em;white-space:nowrap;display:flex;align-items:baseline;gap:8px}
.logo-sub{font-family:var(--mono);font-size:9px;color:var(--t4);letter-spacing:.12em;text-transform:uppercase}
.vl{width:1px;height:20px;background:var(--line);flex-shrink:0}
.sw-wrap{flex:1;max-width:400px;position:relative}
.sw-wrap input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:6px 12px 6px 32px;color:var(--t1);font-size:12px;font-family:var(--sans);outline:none;transition:border-color .15s}
.sw-wrap input:focus{border-color:var(--t1)}
.sw-wrap input::placeholder{color:var(--t4)}
.sw-wrap i{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--t4);font-size:15px}
.tr{display:flex;gap:6px;margin-left:auto;align-items:center}
.ib{display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 10px;gap:5px;background:transparent;border:1px solid var(--line);border-radius:3px;cursor:pointer;font-size:12px;font-family:var(--sans);color:var(--t2);transition:all .12s;white-space:nowrap}
.ib:hover{border-color:var(--t1);color:var(--t1)}
.ib.solid{background:var(--t1);color:#fff;border-color:var(--t1)}
.ib.solid:hover{background:#333}
.ib.danger{background:#fdf0f0;color:var(--danger);border-color:#f0c8c8}
.ib i{font-size:14px}
.ib-sq{width:30px;padding:0}
.shell{display:flex;margin-top:var(--th);min-height:calc(100vh - var(--th))}
.sidebar{width:var(--sw);flex-shrink:0;background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;position:fixed;top:var(--th);bottom:0;left:0;overflow-y:auto}
.sidebar::-webkit-scrollbar{width:0}
.ns{padding:14px 0 8px;border-bottom:1px solid var(--line)}
.nl{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--t4);padding:0 16px 6px}
.ni{display:flex;align-items:center;gap:8px;padding:6px 16px;cursor:pointer;color:var(--t2);font-size:12px;transition:all .12s;position:relative}
.ni:hover{color:var(--t1);background:var(--bg2)}
.ni.on{color:var(--t1);font-weight:500;background:var(--bg2)}
.ni.on::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:2px;background:var(--t1);border-radius:0 2px 2px 0}
.ni i{font-size:15px;flex-shrink:0}
.nb{margin-left:auto;font-family:var(--mono);font-size:9px;font-weight:600;background:var(--bg3);color:var(--t3);padding:1px 5px;border-radius:2px}
.nb.red{background:#fdf0f0;color:var(--danger)}
.sidebar-foot{padding:12px 16px;border-top:1px solid var(--line);margin-top:auto}
.ucard{display:flex;align-items:center;gap:8px;padding:4px;border-radius:3px;cursor:pointer}
.ucard:hover{background:var(--bg2)}
.ava{width:28px;height:28px;border-radius:50%;background:var(--t1);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.uinfo p{font-size:12px;font-weight:500}
.uinfo span{font-size:10px;color:var(--t4)}
.main{margin-left:var(--sw);flex:1;overflow-y:auto;overflow-x:hidden}
.main::-webkit-scrollbar{width:4px}
.main::-webkit-scrollbar-thumb{background:var(--line)}
.page{display:none;padding:28px 32px;max-width:1200px}
.page.on{display:block}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.page.on>*{animation:up .2s ease both}
.page.on>*:nth-child(1){animation-delay:.02s}.page.on>*:nth-child(2){animation-delay:.05s}.page.on>*:nth-child(3){animation-delay:.08s}.page.on>*:nth-child(4){animation-delay:.11s}
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;gap:16px}
.ptitle{font-family:var(--serif);font-size:22px;font-weight:700;margin-bottom:3px}
.psub{font-size:12px;color:var(--t3)}
.ph-r{display:flex;gap:6px;flex-shrink:0;align-items:flex-start}
.srow{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:24px}
.sc{background:var(--bg);padding:16px 18px}
.sc-label{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--t4);margin-bottom:8px}
.sc-val{font-family:var(--mono);font-size:28px;font-weight:600;line-height:1}
.sc-sub{font-size:11px;color:var(--t3);margin-top:4px}
.ok{color:var(--ok)}.warn-c{color:var(--warn)}.red{color:var(--danger)}.info-c{color:var(--info)}
.sec{margin-bottom:24px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sh-t{font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.sh-t i{color:var(--t3);font-size:15px}
.sh-a{font-size:11px;color:var(--t3);cursor:pointer;font-family:var(--mono)}
.sh-a:hover{color:var(--t1)}
.tw{border:1px solid var(--line);border-radius:4px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:12px}
thead tr{background:var(--bg2);border-bottom:1px solid var(--line)}
th{padding:8px 14px;text-align:left;font-family:var(--mono);font-size:9px;font-weight:600;color:var(--t4);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);color:var(--t2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .1s;cursor:pointer}
tbody tr:hover{background:var(--bg2)}
.td1{color:var(--t1)!important;font-weight:500}
.tdm{font-family:var(--mono);font-size:11px}
.badge{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 6px;border-radius:2px;white-space:nowrap}
.b-def{background:var(--bg3);color:var(--t3)}.b-inv{background:var(--t1);color:#fff}.b-ok{background:#edf7f1;color:var(--ok)}.b-warn{background:#fdf8ec;color:var(--warn)}.b-danger{background:#fdf0f0;color:var(--danger)}.b-info{background:#eef4fd;color:var(--info)}
.tag{display:inline-flex;background:var(--bg2);border:1px solid var(--line);color:var(--t3);font-size:11px;padding:2px 8px;border-radius:2px;cursor:pointer;transition:all .12s;font-family:var(--mono)}
.tag:hover,.tag.on{background:var(--t1);color:#fff;border-color:var(--t1)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.letter-workbench{display:grid;grid-template-columns:minmax(360px,0.95fr) minmax(420px,1.05fr);gap:22px;align-items:stretch}
.agent-panel{border-top:1px solid var(--line);min-height:560px;display:flex;flex-direction:column}
.agent-kicker{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--t4);margin-bottom:8px}
.agent-title{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--t1);line-height:1.25}
.agent-desc{font-size:12px;color:var(--t3);line-height:1.8;margin-top:8px;max-width:560px}
.agent-chat{margin-top:18px;border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;min-height:390px;background:var(--bg)}
.agent-feed{flex:1;padding:14px;display:flex;flex-direction:column;gap:10px;overflow:auto;max-height:420px}
.agent-feed::-webkit-scrollbar{width:3px}.agent-feed::-webkit-scrollbar-thumb{background:var(--line)}
.msg{display:block;position:relative;width:auto;min-width:0;font-size:12px;line-height:1.75;border-radius:3px;padding:9px 11px;box-sizing:border-box;height:auto;min-height:0;overflow:visible;clear:both;flex:0 0 auto}
.msg.gr,.msg.musician{align-self:stretch;margin-right:0;background:transparent;color:var(--t1);border:0;border-left:2px solid var(--line);border-radius:0;padding:7px 0 7px 12px}
.msg.gr{border-left-color:#12a052}
.msg.note{align-self:stretch;margin:2px 0;background:var(--bg2);color:var(--t3);border:1px dashed var(--line);border-radius:3px;padding:8px 10px}
.msg.gr{position:relative;margin-left:46px;min-height:46px;max-width:calc(100% - 46px)}
.msg.gr:before{content:'';position:absolute;left:-46px;top:0;width:34px;height:34px;border-radius:50%;border:1px solid var(--t1);background:#111 url('/assets/gr-avatar.jpeg') center 20%/cover;filter:grayscale(1);box-shadow:0 0 0 3px #fff}
.msg.user{align-self:flex-end;margin-left:auto;max-width:74%;min-width:74px;background:var(--t1);color:#fff;border:1px solid var(--t1);padding:8px 10px}
.msg-meta{display:block;font-family:var(--mono);font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--t4);margin-bottom:4px}
.msg-text{display:block;position:static;width:100%;max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;line-height:1.75}
.msg.user .msg-meta{color:rgba(255,255,255,.56)}
.msg.user .msg-text{color:#fff}
.agent-input{border-top:1px solid var(--line);display:flex;gap:8px;padding:10px;background:var(--bg)}
.agent-input input{flex:1;border:1px solid var(--line);border-radius:3px;height:34px;padding:0 10px;font-family:var(--sans);font-size:12px;outline:none;color:var(--t1);background:var(--bg)}
.agent-input input:focus{border-color:var(--t1)}
.agent-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.agent-tools .ib{height:34px}
.agent-lore{font-size:11px;color:var(--t3);line-height:1.8;margin-top:10px;border-left:2px solid var(--line);padding-left:10px}
.musician-list{margin-top:18px;border-top:1px solid var(--line)}
.musician-card{border-bottom:1px solid var(--line)}
.musician-head{display:flex;align-items:center;gap:12px;padding:13px 0;cursor:pointer}
.musician-avatar{width:34px;height:34px;border-radius:50%;border:1px solid var(--t1);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:13px;flex-shrink:0;background:var(--bg);color:var(--t1);overflow:hidden}
.musician-avatar.has-image{background:#111 center 18%/cover no-repeat;color:transparent;box-shadow:0 0 0 3px #fff}
.musician-main{flex:1;min-width:0}
.musician-name{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--t1);line-height:1.3}
.musician-sub{font-size:11px;color:var(--t3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.musician-state{font-family:var(--mono);font-size:9px;color:var(--t3);border:1px solid var(--line);padding:2px 6px;border-radius:2px}
.musician-toggle{font-family:var(--mono);font-size:16px;color:var(--t3);width:18px;text-align:center}
.musician-body{display:none;padding:0 0 16px 46px}
.musician-card.open .musician-body{display:block}
.musician-card.open .musician-toggle{color:var(--t1)}
.musician-tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tool-primary{border-color:#2f6df6!important;color:#174fc7!important;background:#eef4ff!important}
.tool-yellow{border-color:#e2b100!important;color:#7a5a00!important;background:#fff6cc!important}
.tool-red{border-color:#e23b3b!important;color:#b01212!important;background:#fff0f0!important}
.tool-primary:hover,.tool-yellow:hover,.tool-red:hover{filter:saturate(1.08);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.mini-chat{border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.mini-feed{padding:10px;display:flex;flex-direction:column;gap:8px;max-height:210px;overflow:auto}
.mini-feed .msg.gr,.mini-feed .msg.musician{align-self:stretch;margin-left:0;max-width:100%}
.mini-feed .msg.user{max-width:72%;min-width:74px}
.mini-input{display:flex;gap:6px;border-top:1px solid var(--line);padding:8px}
.mini-input input{flex:1;height:30px;border:1px solid var(--line);border-radius:3px;padding:0 8px;font-size:12px;outline:none}
.mini-input input:focus{border-color:var(--t1)}
.fate-overlay{position:fixed;inset:0;background:rgba(255,255,255,.88);z-index:520;display:none;align-items:center;justify-content:center;padding:24px}
.fate-overlay.open{display:flex}
.fate-panel{width:min(920px,94vw);max-height:90vh;overflow:auto;background:#fff;border:1px solid var(--t1);box-shadow:0 24px 80px rgba(0,0,0,.18);padding:22px;position:relative}
.fate-panel.accent-blue{border-top:5px solid #2f6df6}
.fate-panel.accent-yellow{border-top:5px solid #e2b100}
.fate-panel.accent-red{border-top:5px solid #e23b3b}
.fate-panel.accent-blue .fate-title{color:#174fc7}
.fate-panel.accent-yellow .fate-title{color:#7a5a00}
.fate-panel.accent-red .fate-title{color:#b01212}
.fate-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px}
.fate-title{font-family:var(--serif);font-size:24px;font-weight:700}
.fate-sub{font-size:12px;color:var(--t3);line-height:1.7;margin-top:4px}
.fate-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.fate-collect{border:1px solid var(--line);background:#fff;height:32px;border-radius:3px;cursor:pointer;font-size:12px;padding:0 12px;font-family:var(--sans)}
.fate-panel.accent-blue .fate-collect{border-color:#2f6df6;color:#174fc7;background:#eef4ff}
.fate-panel.accent-yellow .fate-collect{border-color:#e2b100;color:#7a5a00;background:#fff6cc}
.fate-panel.accent-red .fate-collect{border-color:#e23b3b;color:#b01212;background:#fff0f0}
.fate-collect:hover{filter:saturate(1.08);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.fate-close{border:1px solid var(--line);background:#fff;width:32px;height:32px;border-radius:3px;cursor:pointer;font-size:18px}
.fate-close:hover{border-color:var(--t1)}
.floating-card-wrap{min-height:360px;display:flex;align-items:center;justify-content:center;perspective:1100px;position:relative;overflow:hidden;background:linear-gradient(180deg,#fff,#f6f6f6);border:1px solid var(--line)}
.floating-card-wrap:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 34%,rgba(0,0,0,.08),transparent 32%);pointer-events:none}
.fate-card{width:220px;height:310px;position:relative;z-index:1;cursor:pointer;transform-style:preserve-3d;animation:fateFloat 4.8s ease-in-out infinite}
.fate-card-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.2,.8,.2,1)}
.fate-card.flipped .fate-card-inner{transform:rotateY(180deg)}
@keyframes fateFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-14px) rotate(1.5deg)}}
.fate-face{position:absolute;inset:0;border:1px solid #111;border-radius:10px;backface-visibility:hidden;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.22)}
.fate-back{background:#111;color:#fff;display:flex;align-items:center;justify-content:center}
.fate-back:before{content:'';width:142px;height:226px;border:1px solid rgba(255,255,255,.38);border-radius:72px;background:radial-gradient(circle at 50% 34%,transparent 0 30px,rgba(255,255,255,.18) 31px 32px,transparent 33px),repeating-linear-gradient(45deg,transparent 0 9px,rgba(255,255,255,.08) 9px 10px)}
.fate-back.avatar-back{background:#050505 var(--fate-avatar) center 28%/cover no-repeat}
.fate-back.avatar-back:before{content:'';position:absolute;inset:0;width:auto;height:auto;border:0;border-radius:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.42)),radial-gradient(circle at 50% 36%,transparent 0 42%,rgba(0,0,0,.55) 78%)}
.fate-back.avatar-back:after{content:attr(data-card-name);position:absolute;left:16px;right:16px;bottom:14px;height:28px;border:1px solid rgba(255,255,255,.36);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:rgba(255,255,255,.82);background:rgba(0,0,0,.42)}
.fate-front{transform:rotateY(180deg);background:#fff;color:#111;padding:16px;display:flex;flex-direction:column}
.fate-period{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--t3);text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px}
.fate-year{font-family:var(--serif);font-size:40px;font-weight:700;line-height:1;margin-bottom:10px}
.fate-event{font-family:var(--serif);font-size:18px;font-weight:700;line-height:1.5;margin-bottom:10px}
.fate-work{margin-top:auto;font-size:12px;line-height:1.7;color:var(--t2);border-top:1px solid var(--line);padding-top:10px}
.letter-compose{display:none;margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.letter-compose.open{display:block}
.gr-card-note{margin-bottom:12px;border:1px solid var(--line);border-left:3px solid #12a052;background:#fbfbfb;padding:12px 14px 12px 16px;border-radius:4px;color:var(--t2)}
.gr-card-note-title{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--t3);margin-bottom:8px}
.gr-card-note p{margin:0 0 7px;font-size:13px;line-height:1.85}
.gr-card-note p:last-child{margin-bottom:0}
.gr-card-sign{text-align:right;margin-top:10px;font-family:var(--serif);font-size:13px;color:var(--t3)}
.music-card-player{border:1px solid var(--line);border-left:3px solid var(--t1);background:#fff;padding:10px 12px;border-radius:4px;margin:10px 0 12px}
.music-card-player-title{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--t3);margin-bottom:7px}
.music-card-player-name{font-size:12px;color:var(--t2);line-height:1.6;margin-bottom:8px}
.music-card-player audio{width:100%;height:32px;display:block}
.card-audio-slot audio{width:100%;height:32px;display:block}
.mini-player{margin:0 0 10px}
.letter-compose textarea{width:100%;min-height:100px;border:1px solid var(--line);border-radius:4px;padding:10px;font-family:var(--serif);font-size:13px;line-height:1.8;outline:none;resize:vertical}
.letter-compose textarea:focus{border-color:var(--t1)}
.card-library-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.archive-card{min-height:150px;border:1px solid var(--line);border-radius:6px;padding:12px;background:#fff}
.archive-card.main-card{border-left:4px solid #111}
.archive-card.rift-card{border-left:4px solid #9a9a9a;background:#fbfbfb}
.archive-card.locked{background:#f7f7f7;color:var(--t4);display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--mono);font-size:11px}

const cardAudioState={};
let sharedCardAudio=null;
let sharedCardAudioKey='';
function ensureSharedCardAudio(){
  if(sharedCardAudio)return sharedCardAudio;
  sharedCardAudio=document.createElement('audio');
  sharedCardAudio.controls=true;
  sharedCardAudio.preload='none';
  sharedCardAudio.style.width='100%';
  sharedCardAudio.style.height='32px';
  sharedCardAudio.addEventListener('timeupdate',()=>{
    if(!sharedCardAudioKey)return;
    const state=cardAudioState[sharedCardAudioKey]||{};
    state.time=sharedCardAudio.currentTime||0;
    state.playing=!sharedCardAudio.paused&&!sharedCardAudio.ended;
    cardAudioState[sharedCardAudioKey]=state;
  });
  sharedCardAudio.addEventListener('play',()=>{
    if(!sharedCardAudioKey)return;
    if(sharedCardAudio.duration&&sharedCardAudio.currentTime>=sharedCardAudio.duration-.15){
      try{sharedCardAudio.currentTime=0;}catch(e){}
    }
    cardAudioState[sharedCardAudioKey]={...(cardAudioState[sharedCardAudioKey]||{}),playing:true};
  });
  sharedCardAudio.addEventListener('pause',()=>{
    if(!sharedCardAudioKey)return;
    cardAudioState[sharedCardAudioKey]={...(cardAudioState[sharedCardAudioKey]||{}),time:sharedCardAudio.currentTime||0,playing:false};
  });
  sharedCardAudio.addEventListener('ended',()=>{
    if(!sharedCardAudioKey)return;
    cardAudioState[sharedCardAudioKey]={...(cardAudioState[sharedCardAudioKey]||{}),time:0,playing:false};
    try{sharedCardAudio.currentTime=0;}catch(e){}
  });
  return sharedCardAudio;
}

function playClockTick(ctx,when=ctx.currentTime,heavy=false){
  const osc=ctx.createOscillator(),gain=ctx.createGain(),filter=ctx.createBiquadFilter();

  osc.frequency.setValueAtTime(heavy?780:1180,when);

  gain.gain.exponentialRampToValueAtTime(.0001,when+(heavy?.075:.045));
  osc.connect(filter).connect(gain).connect(ctx.destination);
  osc.start(when);osc.stop(when+.08);
}

function hashText(text){
  let h=2166136261;
  for(let i=0;i<text.length;i++){
    h^=text.charCodeAt(i);
    h=Math.imul(h,16777619);
  }
  return (h>>>0).toString(36);
}
function agentCacheKey(payload){
  const raw=JSON.stringify({
    v:4,
    mode:payload.mode||'',
    tool:payload.tool||'',
    musicianId:payload.musicianId||'',
    musicianName:payload.musicianName||'',
    anchor:payload.anchor?`${payload.anchor.year||''}-${payload.anchor.period||''}-${payload.anchor.event||''}`:'',
    card:payload.card?`${payload.card.year||''}-${payload.card.period||''}-${payload.card.event||''}`:'',
    turn:payload.turn||0,
    message:payload.message||'',
    history:(payload.history||[]).map(x=>`${x.role||''}:${x.text||x.content||''}`).join('|').slice(-1200)
  });
  return `letterAgentCache:${payload.mode||'mode'}:${payload.tool||'plain'}:${payload.musicianId||'none'}:${hashText(raw)}`;
}
function getAgentCache(payload){
  if(payload?.noCache)return '';
  try{
    const item=JSON.parse(localStorage.getItem(agentCacheKey(payload))||'null');
    if(item&&Date.now()-item.time<86400000&&item.reply)return item.reply;
  }catch{}
  return '';
}
function setAgentCache(payload,reply){
  if(payload?.noCache)return;
  try{localStorage.setItem(agentCacheKey(payload),JSON.stringify({time:Date.now(),reply}));}catch{}
}
async function callLetterAgent(payload,fallback){
  const cached=getAgentCache(payload);
  if(cached)return cached;
  const res=await fetch(API_ORIGIN + '/api/letter-agent',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload)
  });
  if(!res.ok)throw new Error('DeepSeek 暂时没有回信');
  const data=await res.json();
  const reply=(data.reply||'').trim();
  if(!reply)throw new Error('DeepSeek 回信为空');
  setAgentCache(payload,reply);
  return reply;
}

        `他死后，维也纳有上万人送葬。那个曾被父亲推到琴凳前的孩子，最终让一座城市在寂静里承认他的名字。`,
        `这件事真正完成的，不是一个英雄神话，而是一条漫长的反击弧线。他听不见悼词，但沉默终于替他说完了。`
      ]
    }
  };
  const picked=notes[agent?.id]?.[String(card?.year)];
  return polishGrNoteLines(agent,card,picked||generic);
}
function openFateCard(){
  setFateAccent('');
  const agent=currentAgent();
  const state=getGameState(agent.id);
  const progress=cardProgress(agent.id);
  if(progress.allDone){showFateCompletion(agent);return;}
  const chapter=getActiveChapter(agent.id);
  if(chapter&&chapter.card&&chapter.stage!=='interrupted'&&chapter.stage!=='completed'){
    if(chapter.stage==='chatting'){
      const left=Math.max(1,(chapter.interruptAt||3)-(chapter.turns||0));
      toast(`还需要再聊 ${left} 轮，才能抽下一张`);
    }else{
      toast('先把这张牌写成一封信，再继续抽下一张');
    }
    return;
  }
  const deck=getDeck(agent.id);
  const unlocked=new Set(JSON.parse(localStorage.getItem(fateKey(agent.id))||'[]'));
  const locked=deck.map((_,i)=>i).filter(i=>!unlocked.has(i));
  const mainLocked=locked.filter(i=>cardKind(deck[i])==='main');
  const riftLocked=locked.filter(i=>cardKind(deck[i])==='rift');
  const pool=mainLocked.length?mainLocked:(riftLocked.length?riftLocked:(locked.length?locked:deck.map((_,i)=>i)));
  const index=pool[Math.floor(Math.random()*pool.length)];
  activeFateCard={...deck[index],index,musicianId:agent.id,musicianName:agent.name};
  ensurePersonaAnchor(activeFateCard);
  const title=document.getElementById('fate-title'),sub=document.getElementById('fate-sub'),content=document.getElementById('fate-content'),overlay=document.getElementById('fate-overlay');
  if(title)title.textContent=`${agent.name} · 命运卡牌`;
  if(sub)sub.textContent=cardKind(activeFateCard)==='rift'?'主线已经走完，支线卡开始浮现。它们补完裂缝，不影响人物结局。':'先抽满主线卡。主线完成后，人物结局解锁，支线卡才会浮现。';
  const avatarBack=agent.avatar?` avatar-back`:'';
  const avatarStyle=agent.avatar?` style="--fate-avatar:url('${esc(agent.avatar)}')"`:'';
  const avatarName=agent.avatar?` data-card-name="${esc(agent.name)}"`:'';
  const grNote=grCardNote(agent,activeFateCard).map(line=>`<p>${esc(line)}</p>`).join('');
  const player=cardAudioHtml(activeFateCard);
  if(content)content.innerHTML=`<div class="floating-card-wrap"><div class="fate-card" id="active-fate-card" onclick="flipFateCard()"><div class="fate-card-inner"><div class="fate-face fate-back${avatarBack}"${avatarStyle}${avatarName}></div><div class="fate-face fate-front"><span class="card-kind ${cardKindClass(activeFateCard)}">${cardKindLabel(activeFateCard)}</span><div class="fate-period">${esc(activeFateCard.period)}</div><div class="fate-year">${esc(activeFateCard.year)}</div><div class="fate-event">${esc(activeFateCard.event)}</div><div class="fate-work">对应作品<br><strong>${esc(activeFateCard.work)}</strong></div></div></div></div></div><div class="letter-compose" id="letter-compose">${player}<div class="gr-card-note"><div class="gr-card-note-title">Gr小姐的留言</div>${grNote}<div class="gr-card-sign">——Gr小姐</div></div><textarea id="fate-letter-text" placeholder="给${esc(agent.name)}写一封信。不要试图改写历史，只写你看见了什么。"></textarea><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button class="ib" onclick="closeFateOverlay()">回到聊天</button><button class="ib solid" onclick="sendFateLetter()">寄出这封信</button></div></div>`;
  overlay?.classList.add('open');
  mountCardAudioPlayer(`${activeFateCard.musicianId}-${activeFateCard.year}`);
}
function flipFateCard(){
  const card=document.getElementById('active-fate-card');
  if(!card||card.classList.contains('flipped'))return;
  const turns=2+Math.floor(Math.random()*4);
  card.style.animationDuration=(1.4+turns*.12)+'s';
  card.querySelector('.fate-card-inner').style.transform=`rotateY(${turns*360+180}deg)`;
  setTimeout(()=>{card.classList.add('flipped');document.getElementById('letter-compose')?.classList.add('open');},850);
  unlockFateCard(activeFateCard.musicianId,activeFateCard.index);
  activateFateChapter(activeFateCard,'card_drawn');
  renderMusicianAgents(activeFateCard.musicianId);
  playBookPageSound();
}
async function sendFateLetter(){
  if(!activeFateCard)return;
  const text=(document.getElementById('fate-letter-text')?.value||'').trim();
  if(!text){toast('先写一点内容，再寄出');return;}
  const agent=musicianAgents.find(a=>a.id===activeFateCard.musicianId)||currentAgent();
  currentMusicianId=agent.id;
  const chapter=activateFateChapter(activeFateCard,'letter_sent');
  const entry={id:`letter-${activeFateCard.musicianId}-${activeFateCard.index}-${Date.now()}`,source:'fate-letter',time:new Date().toISOString(),card:activeFateCard,letter:text};
  saveFateLetter(agent.id,entry);
  musicianChats[agent.id]=musicianChats[agent.id]||[];
  musicianChats[agent.id].push({role:'user',text:`命运卡牌来信：${text}`});
  persistMusicianChat(agent.id);
  renderMusicianAgents(agent.id);
  closeFateOverlay();
  const pending=addMsg('mini-feed-'+agent.id,'musician','信纸正在穿过隧道。',agent.name);
  try{
    const cardReply=await callLetterAgent({
      mode:'card_letter',
      musicianId:agent.id,
      musicianName:agent.name,
      card:activeFateCard,
      anchor:chapter?.anchor||getPersonaAnchor(agent.id),
      message:`历史边界：${boundaryText(agent.id)}\n玩家写给${activeFateCard.year} · ${activeFateCard.period}时期${agent.name}的一封信：${text}`,
      history:[],
      max_tokens:420,
      temperature:.72
    },localCardPeriodReply(agent,activeFateCard,text));
    const meta=await generateLetterMeta(agent,activeFateCard,text,cardReply);
    saveFateLetter(agent.id,{...entry,reply:cardReply,impact:meta.impact,manuscript:meta.manuscript});
    const chatReply=await callLetterAgent({
      mode:'musician',
      musicianId:agent.id,
      musicianName:agent.name,
      card:activeFateCard,
      anchor:chapter?.anchor||getPersonaAnchor(agent.id),
      turn:0,
      message:`历史边界：${boundaryText(agent.id)}\n玩家刚给命运卡牌“${activeFateCard.year} · ${activeFateCard.period}”时期的你寄出一封信。卡牌时期的回信已写入旅行信札，不要复述那封回信。请以身份锚点年龄的你，回应玩家这次寄信后的余波。玩家信件：${text}`,
      history:musicianChats[agent.id].slice(-6),
      max_tokens:480,
      temperature:.76
    },localAnchoredChatReply(agent,activeFateCard,text,cardReply));
    musicianChats[agent.id].push({role:'musician',text:chatReply});
    persistMusicianChat(agent.id);
    if(pending)pending.innerHTML=`<span class="msg-meta">${escHtml(agent.name)}</span><span class="msg-text">${escHtml(chatReply)}</span>`;
  }catch(e){
    const cardReply=localCardPeriodReply(agent,activeFateCard,text);
    const chatReply=localAnchoredChatReply(agent,activeFateCard,text,cardReply);
    musicianChats[agent.id].push({role:'musician',text:chatReply});
    persistMusicianChat(agent.id);
    const meta=await generateLetterMeta(agent,activeFateCard,text,cardReply);
    saveFateLetter(agent.id,{...entry,reply:cardReply,impact:meta.impact,manuscript:meta.manuscript});
    if(pending)pending.innerHTML=`<span class="msg-meta">${escHtml(agent.name)} · 本地兜底</span><span class="msg-text">${escHtml(chatReply)}</span>`;
  }
}
function openCardLibrary(){
  setFateAccent('');
  startClockTickSound();
  const agent=currentAgent();
  const {deck,unlocked,mainTotal,mainDone,riftTotal,riftDone,mainComplete}=cardProgress(agent.id);
  const left=Math.max(0,mainTotal-mainDone);
  document.getElementById('fate-title').textContent=`${agent.name} · 卡牌曲库`;
  document.getElementById('fate-sub').textContent='主线卡走完人生；支线卡补完裂缝。人物结局只要求主线完成。';
  const lockedAvatarClass=agent.avatar?' avatar-locked':'';
  const lockedAvatarStyle=agent.avatar?` style="--fate-avatar:url('${esc(agent.avatar)}')"`:'';
  const beethovenScale=agent.id==='beethoven'?`<div class="travel-letter" style="margin:0 0 14px;border-left-color:#111"><strong>听力命运标尺</strong><br>声音仍在：1778-1797 · 耳鸣逼近：1798-1802 · 与寂静搏斗：1803-1817 · 寂静深处：1818-1827</div>`:'';
  document.getElementById('fate-content').innerHTML=`${beethovenScale}<div class="card-progress"><span>主线 ${mainDone}/${mainTotal}</span>${riftTotal?`<span>支线 ${riftDone}/${riftTotal}</span>`:''}</div><div class="card-library-grid">${deck.map((c,i)=>unlocked.has(i)?`<div class="archive-card ${cardKind(c)}-card"><span class="card-kind ${cardKindClass(c)}">${cardKindLabel(c)}</span><div class="fate-period">${esc(c.period)}</div><div class="fate-year">${esc(c.year)}</div><div class="fate-event">${esc(c.event)}</div><div class="fate-work">${esc(c.work)}</div></div>`:`<div class="archive-card locked ${cardKind(c)}-card${lockedAvatarClass}"${lockedAvatarStyle}><div><span class="card-kind ${cardKindClass(c)}">${cardKindLabel(c)}</span><br><i class="ti ti-lock"></i><br>第 ${i+1} 张<br>尚未抽出</div></div>`).join('')}</div><div style="margin-top:14px;display:flex;gap:10px;justify-content:space-between;align-items:center"><button class="ib" onclick="closeFateOverlay()">返回 Gr 小姐聊天</button><button class="ib ${mainComplete?'solid':''}" onclick="${mainComplete?`openAgentTool('ending','${agent.id}')`:`toast('还差 ${left} 张主线卡，才能查看人物结局')`}">${mainComplete?'人物结局':`人物结局 · 主线还差 ${left} 张`}</button></div>`;
  document.getElementById('fate-overlay')?.classList.add('open');
}
function openTravelLetter(id){
  setFateAccent('');
  playHeavyWoodDoorSound();
  id=id||currentMusicianId||'mozart';
  const agent=musicianAgents.find(a=>a.id===id)||musicianAgents[0];
  currentMusicianId=agent.id;
  const letters=getFateLetters(agent.id).filter(x=>String(x.id||'').startsWith('letter-')||x.source==='fate-letter'||!x.id);
  document.getElementById('fate-title').textContent=`${agent.name} · 旅行信札`;
  document.getElementById('fate-sub').textContent='只保留你正式寄出的信。普通聊天不会进入这里。';
  const body=letters.length?letters.map(x=>`<div class="travel-letter" style="margin-bottom:10px"><strong>${esc(x.card?.year||'—')} · ${esc(x.card?.period||'未命名章节')}</strong><br>${esc(x.card?.event||'这页记录来自一次寄信。')}<br><br>你写给他的信：${esc(x.letter||'—')}<br><br>他的回信：${esc(x.reply||'信还在路上。')}<br><br><span style="color:var(--t3)">注释：${esc(x.impact||letterImpactNote(agent,x.card,x.letter,x.reply))}</span><br><br><em style="color:var(--t2);font-family:var(--serif)">${esc(x.manuscript||manuscriptLine(agent,x.card,x.letter,x.reply))}</em></div>`).join(''):'<div class="travel-letter">还没有旅行信札。先抽一张命运卡牌，给音乐家写信。</div>';
  document.getElementById('fate-content').innerHTML=body+`<div style="margin-top:14px"><button class="ib" onclick="closeFateOverlay()">返回 Gr 小姐聊天</button></div>`;
  document.getElementById('fate-overlay')?.classList.add('open');
}
function toolTitle(kind){
  return kind==='transcript'?'滴答回溯':kind==='life'?'人生大事':kind==='ending'?'人物结局':'最后的来信';
}
function localTranscript(agent,chat){
  if(!chat.length)return '还没有聊天记录。';
  return chat.map(m=>`${m.role==='user'?'你':agent.name}：${m.text}`).join('\n\n');
}
function localLifeSummary(agent,chat,letters){
  const years=[...new Set(letters.map(x=>x.card?.year).filter(Boolean))];
  const first=years[years.length-1]||'初见那年';
  const latest=years[0]||'后来某年';
  const impacts=letters.map(x=>x.impact).filter(Boolean).slice(0,3);
  return `旁观这段联系，最先被看见的是${first}年的一页纸。它没有把${agent.name}从历史里带走，只让他在人生的边角多停了一会儿。\n\n到${latest}，玩家留下的痕迹已经不只在信里：${impacts.length?impacts.join('；'):'一张草稿没有被揉掉，一句争辩被咽回去，一个旁人晚了一步离开。'}\n\n这些事太小，小到不会写进传记。可也正因为小，它们像灰尘落在琴键缝里，证明有人曾经靠近过他。`;
}
function localFinalLetter(agent,chat,letters){
  const last=letters[0]?.card||getActiveChapter(agent.id)?.card||{};
  return `我写这封信时，已经走到${last.year||'最后那一年'}的门口。\n\n我仍记得你。不是因为你改变了我的命运，而是因为你在那些命运最吵的时候，把一句话放得很轻。\n\n我这一生有太多没来得及解释的事。若你曾在某一页里看见我，请不要只记住结局。也记住我曾认真地活过，认真地听过你。`;
}
function localCharacterEnding(agent,letters,firstCard,lastCard){
  const impacts=letters.map(x=>x.impact).filter(Boolean).slice(0,4);
  const first=firstCard||letters[letters.length-1]?.card||{};
  const last=lastCard||letters[0]?.card||{};
  const immutable=(musicianBoundaries[agent.id]?.immutable||[]).slice(0,2).join(' ');
  return `玩家第一次遇到${agent.name}，记录在${first.year||'某一年'}的${first.period||'一张未命名卡牌'}。${immutable||'那不是历史的起点，只是这条时间线第一次被看见的地方。'}\n\n已确认的变数没有改写作品和结局，只扩大到边缘：${impacts.length?impacts.join('；'):'一封信被多读了一遍，一个旁人少说了一句闲话，一张草稿没有被揉掉。'}\n\n你究竟是在安慰他，还是在借他安慰自己？\n\n本轮档案到此封存。下一次相遇，将发生在另一个时空。`;
}
function latestLetterCard(letters){
  const cards=letters.map(x=>x.card).filter(Boolean);
  return cards.sort((a,b)=>(Number(b.year)||0)-(Number(a.year)||0))[0]||null;
}
async function openAgentTool(kind,id=currentMusicianId){
  setFateAccent(kind);
  playNewspaperTearSound();
  const agent=musicianAgents.find(a=>a.id===id)||currentAgent();
  currentMusicianId=agent.id;
  const chat=musicianChats[agent.id]||[];
  const letters=getFateLetters(agent.id).filter(x=>String(x.id||'').startsWith('letter-')||x.source==='fate-letter'||!x.id);
  const chapter=getActiveChapter(agent.id);
  const firstCard=getPersonaAnchor(agent.id);
  const lastCard=latestLetterCard(letters)||chapter?.card||firstCard;
  const title=toolTitle(kind);
  const fallback=kind==='transcript'?localTranscript(agent,chat):kind==='life'?localLifeSummary(agent,chat,letters):kind==='ending'?localCharacterEnding(agent,letters,firstCard,lastCard):localFinalLetter(agent,chat,letters);
  document.getElementById('fate-title').textContent=`${agent.name} · ${title}`;
  document.getElementById('fate-sub').textContent=kind==='transcript'?'导出你和音乐家的全部聊天记录。':kind==='life'?'根据聊天与卡牌，总结你们共同经历过的人生节点。':kind==='ending'?'本轮时空档案结算。':'以音乐家最后一张卡牌的口吻，写给你最后的回信。';
  document.getElementById('fate-content').innerHTML=`<div class="travel-letter">正在请 DeepSeek 整理。若接口不可用，会自动使用本地版本。</div>`;
  document.getElementById('fate-overlay')?.classList.add('open');
  try{
    const formalMaterial=letters.map(x=>`${x.card?.year||'—'} · ${x.card?.period||'—'}：玩家写“${x.letter||''}”；卡牌时期回信“${x.reply||''}”；20%变数“${x.impact||''}”；页边手稿“${x.manuscript||''}”`).join('\n');
    const ai=await callLetterAgent({
      mode:'agent_tool',
      tool:title,
      musicianId:agent.id,
      musicianName:agent.name,
      card:(kind==='final'||kind==='ending')?lastCard:(chapter?.card||lastCard||null),
      anchor:firstCard,
      message:`工具：${title}
初见卡牌：${firstCard?`${firstCard.year} · ${firstCard.period} · ${firstCard.event}`:'暂无'}
当前卡牌：${chapter?.card?`${chapter.card.year} · ${chapter.card.period} · ${chapter.card.event}`:'暂无'}
最后参考卡牌：${lastCard?`${lastCard.year} · ${lastCard.period} · ${lastCard.event}`:'暂无'}
历史边界：${boundaryText(agent.id)}
正式信札材料：${formalMaterial}
已解锁卡牌：${getUnlockedFateCards(agent.id).map(x=>`${x.year} · ${x.period} · ${x.event}`).join('\n')}
注意：不要引用普通聊天框里的旧回复。只根据上面的正式信札材料重新生成全新内容。`,
      history:[],
      noCache:true,
      max_tokens:kind==='final'?680:kind==='ending'?560:620,
      temperature:kind==='final'?.76:kind==='ending'?.54:.68
    },fallback);
    const extra=kind==='transcript'?`<hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><pre style="white-space:pre-wrap;font-family:var(--sans);line-height:1.75">${esc(localTranscript(agent,chat))}</pre>`:'';
    document.getElementById('fate-content').innerHTML=`<div class="travel-letter">${esc(ai).replace(/\n/g,'<br>')}${extra}</div><div style="margin-top:14px"><button class="ib" onclick="closeFateOverlay()">返回聊天</button></div>`;
  }catch{
    document.getElementById('fate-content').innerHTML=`<div class="travel-letter">${esc(fallback).replace(/\n/g,'<br>')}</div><div style="margin-top:14px"><button class="ib" onclick="closeFateOverlay()">返回聊天</button></div>`;
  }
}
function clearLetterMemory(){
  Object.keys(localStorage).filter(k=>k.startsWith('letter')).forEach(k=>localStorage.removeItem(k));
  grChatHistory=[];
  musicianChats={};
  activeChapters={};
  currentMusicianId='mozart';
  const feed=document.getElementById('gr-chat-feed');
  if(feed)feed.innerHTML='<div class="msg gr"><span class="msg-meta">Gr 小姐</span><span class="msg-text">记忆已经清空。列车还在原处，只是窗上的雾重新结了一层。</span></div>';
  renderMusicianAgents('mozart');
  toast('记忆已清空');
}
function closeFateOverlay(e){
  const overlay=document.getElementById('fate-overlay');
  if(!e||e.target===overlay){
    const keepAudioKey=sharedCardAudioKey;
    overlay?.classList.remove('open');
    renderMusicianAgents(currentMusicianId||activeFateCard?.musicianId||'mozart');
    mountCardAudioPlayer(keepAudioKey);
    stopFateAmbient();
  }
}
window.sendGrMessage=sendGrMessage;
window.quickGr=quickGr;
window.toggleMusicianAgent=toggleMusicianAgent;
window.selectMusicianForGr=selectMusicianForGr;
window.sendMusicianMessage=sendMusicianMessage;
window.openFateCard=openFateCard;
window.flipFateCard=flipFateCard;
window.sendFateLetter=sendFateLetter;

window.openTravelLetter=openTravelLetter;
window.openAgentTool=openAgentTool;
window.clearLetterMemory=clearLetterMemory;
window.downloadFateText=downloadFateText;
window.closeFateOverlay=closeFateOverlay;
window.resetMusicianTimeline=resetMusicianTimeline;
document.addEventListener('DOMContentLoaded',()=>{restoreGrChatHistory();restoreAllMusicianChats();renderMusicianAgents(currentMusicianId||'mozart');});
</script>
