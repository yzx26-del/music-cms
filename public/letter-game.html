@media(max-width:760px){.train-home{padding:0}.stage-frame{width:100vw;height:100vh;aspect-ratio:auto}.scene-wrap{--scene-base:translate(-50%,-50%);left:50%;right:auto;top:50%;width:150vh;min-width:100vw;max-width:none;aspect-ratio:3/2;height:auto;animation:trainSway 16.5s ease-in-out infinite}.scene-image{background-size:contain}.gr-drawer{left:27%;top:39%;width:38%;min-height:26%}.gr-idle-whisper{left:37%;top:42%;font-size:14px}.musician-panel{width:86%;max-height:78%;padding:18px 16px}.musician-choice{grid-template-columns:40px minmax(0,1fr);gap:10px}.musician-choice-enter{grid-column:2;justify-self:start}.musician-choice-avatar{width:40px;height:40px}.sound-toggle{left:12px;bottom:12px}.tutorial-replay{right:12px;bottom:12px}.tutorial-layer:before{background:radial-gradient(ellipse 20% 25% at 36% 62%,rgba(0,0,0,0) 0 42%,rgba(0,0,0,.26) 58%,rgba(0,0,0,.84) 100%),linear-gradient(90deg,rgba(0,0,0,.82),rgba(0,0,0,.76))}.tutorial-layer:after{left:25%;top:42%;width:28%;height:38%}.tutorial-note{left:40%;top:12%;width:50%;max-width:390px;max-height:70vh}.tutorial-copy{max-height:70vh}.tutorial-note p{font-size:14px;line-height:1.75;margin-bottom:8px}.tutorial-actions{left:28%;top:39%}.stage-frame:before{background:linear-gradient(180deg,rgba(0,0,0,.50),rgba(0,0,0,.10) 44%,rgba(0,0,0,.68))}}

<body>
<main class="train-home" aria-label="音乐信札时空列车主界面">
  <div class="stage-frame">
    <div class="scene-wrap">
      <div class="scene-image"></div>
      <div class="window-weather" aria-hidden="true">
        <div class="rain-window rain-left">
          <div class="night-motion"></div>
          <div class="far-rain"></div>
          <div class="glass-fog"></div>
          <div class="glass-streaks"></div>
        </div>
        <div class="rain-window rain-right">
          <div class="night-motion"></div>
          <div class="far-rain"></div>
          <div class="glass-fog"></div>
          <div class="glass-streaks"></div>
        </div>
      </div>
      <div class="lamp-breath lamp-wall" aria-hidden="true"></div>
      <div class="lamp-breath lamp-table" aria-hidden="true"></div>
      <div class="typewriter-glint" aria-hidden="true"></div>
      <a class="hotspot hot-archive" data-label="时空档案袋" aria-label="左上角乐谱画框 时空档案袋" href="/music"></a>
      <button class="hotspot hot-gr" data-label="GR小姐" aria-label="GR小姐 打开音乐家选择面板" onclick="openGrDrawer(event)"></button>
      <div class="gr-idle-whisper" id="grIdleWhisper" aria-hidden="true" hidden>今晚，<br>你想先见谁？</div>
      <a class="hotspot hot-write" data-label="与音乐家对话" aria-label="打字机 与当前音乐家对话" href="/write"></a>
      <a class="hotspot hot-events" data-label="人生大事" aria-label="火漆信封 人生大事" href="/timeline"></a>
      <a class="hotspot hot-letters" data-label="旅行信札" aria-label="羽毛笔与墨水瓶 旅行信札" href="/letters"></a>
      <a class="hotspot hot-final" data-label="最后的来信" aria-label="绝密信件 最后的来信" href="/letter-room"></a>
      <a class="hotspot hot-time" data-label="滴答回溯" aria-label="桌面怀表 滴答回溯" href="/timeline"></a>
      <aside class="gr-drawer" id="grDrawer" aria-label="GR小姐聊天框">
        <button class="gr-close" type="button" aria-label="关闭GR小姐聊天框" onclick="closeGrDrawer(event)">×</button>
        <h2>GR小姐</h2>
        <p id="grLine">我在。先别急着解释整段命运，只告诉我，你听见了哪一个声音。</p>
        <form onsubmit="sendGrWhisper(event)">
          <input name="gr" autocomplete="off" placeholder="轻声告诉她..." aria-label="给GR小姐留言">
          <button type="submit">递出</button>
        </form>
      </aside>
      <section class="musician-panel-layer" id="musicianPanelLayer" aria-label="音乐家选择面板" hidden>
        <div class="musician-panel" role="dialog" aria-modal="true" aria-labelledby="musicianPanelTitle">
          <button class="musician-panel-close" id="musicianPanelClose" type="button" aria-label="关闭音乐家选择面板">×</button>
          <h2 id="musicianPanelTitle">GR小姐</h2>
          <p class="musician-panel-lead">今晚，<br>你想先见谁？</p>
          <div class="musician-choice-list" id="musicianChoiceList"></div>
        </div>
      </section>
      <section class="musician-panel-layer" id="choiceNoticeLayer" aria-label="未选择音乐家提示" hidden>
        <div class="musician-panel" role="dialog" aria-modal="true" aria-labelledby="choiceNoticeTitle">
          <button class="musician-panel-close" id="choiceNoticeClose" type="button" aria-label="关闭提示">×</button>
          <h2 id="choiceNoticeTitle">GR小姐</h2>
          <p class="musician-panel-lead">你似乎，<br>还未决定要前往哪节车厢。<br><br>Gr 会为你们安排这场相遇。</p>
          <button class="musician-choice-enter" id="choiceNoticeGoGr" type="button">去找 Gr</button>
        </div>
      </section>
      <button class="sound-toggle" id="soundToggle" type="button" aria-label="静音雨夜车厢音效" aria-pressed="false">♪</button>
      <button class="tutorial-replay" id="tutorialReplay" type="button">重看引导</button>
      <a class="dev-door" href="/classic" aria-label="隐藏开发入口"></a>
      <section class="tutorial-layer" id="tutorialLayer" aria-label="第一次登车引导" hidden>
        <div class="tutorial-note">
          <div class="tutorial-copy">
            <p>我是 Gr。<br>时空档案局的列车员。</p>
            <p>暴雨冲刷出了新的时空隧道。</p>
            <p>而你的来访，<br>打破了这里上百年的宁静。</p>
            <p>那些被封存在车厢中的记忆，<br>正在重新苏醒。</p>
            <p>如果无人将它们拾起——</p>
            <p>有些旋律，<br>或许会永远停留在未完成的地方。</p>
            <p>莫扎特、贝多芬、肖邦……</p>
            <p>今晚——</p>
            <p>你将重新遇见他们。</p>
            <p>列车不会回头。</p>
            <p>但它，<br>会因你而偏移。</p>
            <p class="sig">——时空列车员 Gr</p>
          </div>
        </div>
        <div class="tutorial-actions">
          <button class="tutorial-enter" id="tutorialEnter" type="button">进入列车</button>
        </div>
      </section>
    </div>
  </div>
</main>
<script>
const sceneWrap=document.querySelector('.scene-wrap');
const soundToggle=document.getElementById('soundToggle');
const tutorialLayer=document.getElementById('tutorialLayer');
const tutorialEnter=document.getElementById('tutorialEnter');
const tutorialReplay=document.getElementById('tutorialReplay');
const musicianPanelLayer=document.getElementById('musicianPanelLayer');
const musicianPanelClose=document.getElementById('musicianPanelClose');
const musicianChoiceList=document.getElementById('musicianChoiceList');
const choiceNoticeLayer=document.getElementById('choiceNoticeLayer');
const choiceNoticeClose=document.getElementById('choiceNoticeClose');
const choiceNoticeGoGr=document.getElementById('choiceNoticeGoGr');
const grHotspot=document.querySelector('.hot-gr');
const grIdleWhisper=document.getElementById('grIdleWhisper');
const AUDIO_LEVELS={rail:.22,rain:.16,ui:.35,music:.12};
const grChoiceMusicians=[
  {id:'mozart',name:'莫扎特',mark:'M',avatar:'assets/mozart-avatar.png',era:'古典主义 · 维也纳',intro:'旅行信札、神童时期、维也纳时期与作品故事。'},
  {id:'beethoven',name:'贝多芬',mark:'B',avatar:'assets/beethoven-avatar.png',era:'古典主义到浪漫主义 · 波恩/维也纳',intro:'命运主题、听觉危机、英雄叙事与交响曲分析。'},
  {id:'chopin',name:'肖邦',mark:'C',era:'浪漫主义 · 华沙/巴黎',intro:'钢琴小品、流亡情绪、沙龙文化与私人信件语气。'},
  {id:'debussy',name:'德彪西',mark:'D',era:'印象主义 · 巴黎',intro:'色彩和声、象征主义文本、城市夜色与水的意象。'},
  {id:'hisaishi',name:'久石让',mark:'H',era:'电影音乐 · 日本',intro:'旋律动机、动画场景、童话感和极简主义织体。'},
  {id:'zimmer',name:'汉斯·季默',mark:'Z',era:'电影音乐 · 好莱坞',intro:'科幻史诗、合成器音色、低频推进和大片叙事。'},
  {id:'kajiura',name:'梶浦由记',mark:'K',era:'动画/游戏音乐 · 日本',intro:'虚构语言、人声织体、战斗音乐和角色命运线。'}
];
let travelAudio=null;
let travelMuted=false;
let tutorialActive=false;
let grInviteTimer=null;
const GR_IDLE_DELAY=300000;
function getAmbientVolume(){return tutorialActive ? 0.24 : 0.44}
function makeNoiseBuffer(ctx,duration=2){
  const buffer=ctx.createBuffer(1,ctx.sampleRate*duration,ctx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
  return buffer;
}
function makeSoftNoiseBuffer(ctx,duration=3){
  const buffer=ctx.createBuffer(1,ctx.sampleRate*duration,ctx.sampleRate);
  const data=buffer.getChannelData(0);
  let last=0;
  for(let i=0;i<data.length;i++){
    last=(last+(Math.random()*2-1)*.035)/1.035;
    data[i]=last*3.2;
  }
  return buffer;
}
function createTravelAudio(){
  const Ctx=window.AudioContext||window.webkitAudioContext;
  const ctx=new Ctx();
  const master=ctx.createGain();
  master.gain.value=getAmbientVolume();
  master.connect(ctx.destination);

  const rainGain=ctx.createGain();
  rainGain.gain.value=AUDIO_LEVELS.rain*.34;
  const rainBody=ctx.createBiquadFilter();
  rainBody.type='bandpass';
  rainBody.frequency.value=520;
  rainBody.Q.value=.42;
  const rainCurtain=ctx.createBiquadFilter();
  rainCurtain.type='lowpass';
  rainCurtain.frequency.value=1050;
  const rain=ctx.createBufferSource();
  rain.buffer=makeSoftNoiseBuffer(ctx,4);
  rain.loop=true;
  rain.connect(rainBody).connect(rainCurtain).connect(rainGain).connect(master);
  rain.start();

  const rumbleGain=ctx.createGain();
  rumbleGain.gain.value=AUDIO_LEVELS.rail*.18;
  const rumbleFilter=ctx.createBiquadFilter();
  rumbleFilter.type='lowpass';
  rumbleFilter.frequency.value=92;
  const rumble=ctx.createBufferSource();
  rumble.buffer=makeSoftNoiseBuffer(ctx,3);
  rumble.loop=true;
  rumble.connect(rumbleFilter).connect(rumbleGain).connect(master);
  rumble.start();

  const railBus=ctx.createGain();
  railBus.gain.value=AUDIO_LEVELS.rail*.62;
  const railFilter=ctx.createBiquadFilter();
  railFilter.type='lowpass';
  railFilter.frequency.value=155;
  railFilter.Q.value=.55;
  railBus.connect(railFilter).connect(master);
  const woodBus=ctx.createGain();
  woodBus.gain.value=.032;
  const woodFilter=ctx.createBiquadFilter();
  woodFilter.type='bandpass';
  woodFilter.frequency.value=420;
  woodFilter.Q.value=1.8;
  woodBus.connect(woodFilter).connect(master);
  const hum=ctx.createOscillator();
  const humGain=ctx.createGain();
  hum.type='sine';
  hum.frequency.value=54;
  humGain.gain.value=.006;
  hum.connect(humGain).connect(master);
  hum.start();
  const railTimer=window.setInterval(()=>{
    if(ctx.state!=='running'||travelMuted)return;
    const now=ctx.currentTime;
    [
      {offset:0,f1:64,f2:38,peak:.10,dur:.42},
      {offset:.34,f1:118,f2:72,peak:.045,dur:.18}
    ].forEach(hit=>{
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type='sine';
      osc.frequency.setValueAtTime(hit.f1,now+hit.offset);
      osc.frequency.exponentialRampToValueAtTime(hit.f2,now+hit.offset+hit.dur*.62);
      gain.gain.setValueAtTime(.0001,now+hit.offset);
      gain.gain.exponentialRampToValueAtTime(hit.peak,now+hit.offset+.045);
      gain.gain.exponentialRampToValueAtTime(.0001,now+hit.offset+hit.dur);
      osc.connect(gain).connect(railBus);
      osc.start(now+hit.offset);
      osc.stop(now+hit.offset+hit.dur+.04);
    });
  },1280);
  function scheduleCabinTick(){
    const delay=5200+Math.random()*9000;
    const tickTimer=window.setTimeout(()=>{
      if(ctx.state==='running'&&!travelMuted){
        const now=ctx.currentTime;
        const src=ctx.createBufferSource();
        const gain=ctx.createGain();
        src.buffer=makeNoiseBuffer(ctx,.16);
        gain.gain.setValueAtTime(.0001,now);
        gain.gain.exponentialRampToValueAtTime(.020,now+.025);
        gain.gain.exponentialRampToValueAtTime(.0001,now+.20);
        src.connect(gain).connect(woodBus);
        src.start(now);
        src.stop(now+.22);
      }
      scheduleCabinTick();
    },delay);
    travelAudio&&(travelAudio.tickTimer=tickTimer);
  }
  window.setTimeout(scheduleCabinTick,3800);
  return{ctx,master,rainGain,railBus,railTimer,hum};
}
function ensureTravelAudio(){
  try{
    if(!travelAudio)travelAudio=createTravelAudio();
    if(travelAudio.ctx.state==='suspended')travelAudio.ctx.resume();
  }catch(e){}
  return travelAudio;
}
function setTravelMuted(muted){
  travelMuted=muted;
  soundToggle?.classList.toggle('is-muted',muted);
  soundToggle?.setAttribute('aria-pressed',String(muted));
  soundToggle?.setAttribute('aria-label',muted?'开启雨夜车厢音效':'静音雨夜车厢音效');
  if(travelAudio){
    const value=muted?0:getAmbientVolume();
    travelAudio.master.gain.setTargetAtTime(value,travelAudio.ctx.currentTime,.04);
  }
}
function syncAmbientVolume(){
  if(travelAudio&&!travelMuted){
    travelAudio.master.gain.setTargetAtTime(getAmbientVolume(),travelAudio.ctx.currentTime,.18);
  }
}
function playSceneTap(){
  try{
    const audio=ensureTravelAudio();
    const ctx=audio?.ctx;
    if(!ctx||travelMuted)return;
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(220,ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(110,ctx.currentTime+.12);
    gain.gain.setValueAtTime(.0001,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(AUDIO_LEVELS.ui*.13,ctx.currentTime+.015);
    gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.16);
    osc.connect(gain).connect(audio.master);
    osc.start();
    osc.stop(ctx.currentTime+.18);
  }catch(e){}
}
function escHtml(value){
  return String(value||'').replace(/[&<>"']/g,char=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[char]));
}
function renderMusicianChoices(){
  if(!musicianChoiceList||musicianChoiceList.dataset.ready==='true')return;
  musicianChoiceList.innerHTML=grChoiceMusicians.map(musician=>{
    const avatarStyle=musician.avatar?` style="background-image:url('${escHtml(musician.avatar)}')"`:'';
    return `<article class="musician-choice">
      <div class="musician-choice-avatar"${avatarStyle}>${escHtml(musician.mark)}</div>
      <div class="musician-choice-main">
        <div class="musician-choice-name">${escHtml(musician.name)}</div>
        <div class="musician-choice-intro">${escHtml(musician.era)} · ${escHtml(musician.intro)}</div>
      </div>
      <a class="musician-choice-enter" href="/write?musician=${encodeURIComponent(musician.id)}" data-musician="${escHtml(musician.id)}">进入</a>
    </article>`;
  }).join('');
  musicianChoiceList.dataset.ready='true';
}
function selectedMusicianId(){
  try{
    const id=localStorage.getItem('letterGameSelectedMusician');
    return grChoiceMusicians.some(musician=>musician.id===id)?id:'';
  }catch(e){return ''}
}
function canShowGrInvite(){
  return !tutorialActive
    && !sceneWrap?.classList.contains('is-leaving')
    && !musicianPanelLayer?.classList.contains('open')
    && !choiceNoticeLayer?.classList.contains('open');
}
function hideGrInvite(){
  grHotspot?.classList.remove('gr-invite');
  grIdleWhisper?.classList.remove('is-visible');
  window.setTimeout(()=>{
    if(!grIdleWhisper?.classList.contains('is-visible'))grIdleWhisper&&(grIdleWhisper.hidden=true);
  },1800);
}
function showGrInvite(){
  if(!canShowGrInvite()||!grHotspot||!grIdleWhisper)return;
  grHotspot.classList.add('gr-invite');
  grIdleWhisper.hidden=false;
  requestAnimationFrame(()=>grIdleWhisper.classList.add('is-visible'));
}
function scheduleGrInvite(delay=GR_IDLE_DELAY){
  window.clearTimeout(grInviteTimer);
  grInviteTimer=window.setTimeout(showGrInvite,delay);
}
function resetGrIdleInvite(){
  if(tutorialActive)return;
  hideGrInvite();
  scheduleGrInvite();
}
function openMusicianPanel(event){
  event?.preventDefault();
  if(tutorialActive||!musicianPanelLayer)return;
  playSceneTap();
  hideGrInvite();
  closeChoiceNotice();
  renderMusicianChoices();
  musicianPanelLayer.hidden=false;
  requestAnimationFrame(()=>musicianPanelLayer.classList.add('open'));
}
function closeMusicianPanel(event){
  event?.preventDefault();
  if(!musicianPanelLayer)return;
  musicianPanelLayer.classList.remove('open');
  window.setTimeout(()=>{
    if(!musicianPanelLayer.classList.contains('open'))musicianPanelLayer.hidden=true;
  },260);
}
function openChoiceNotice(event){
  event?.preventDefault();
  if(tutorialActive||!choiceNoticeLayer)return;
  playSceneTap();
  hideGrInvite();
  choiceNoticeLayer.hidden=false;
  choiceNoticeLayer.classList.add('open');
}
function closeChoiceNotice(event){
  event?.preventDefault?.();
  if(!choiceNoticeLayer)return;
  choiceNoticeLayer.classList.remove('open');
  window.setTimeout(()=>{
    if(!choiceNoticeLayer.classList.contains('open'))choiceNoticeLayer.hidden=true;
  },260);
}
function unlockTravelAudio(){ensureTravelAudio()}
document.addEventListener('pointerdown',unlockTravelAudio,{once:true,capture:true});
document.addEventListener('keydown',unlockTravelAudio,{once:true,capture:true});
function playTutorial(){
  if(!tutorialLayer)return;
  tutorialActive=true;
  window.clearTimeout(grInviteTimer);
  hideGrInvite();
  syncAmbientVolume();
  tutorialLayer.hidden=false;
  tutorialLayer.classList.remove('is-hiding');
  requestAnimationFrame(()=>tutorialLayer.classList.add('show'));
}
function finishTutorial(){
  if(!tutorialLayer)return;
  tutorialActive=false;
  try{localStorage.setItem('tutorial_finished','true')}catch(e){}
  tutorialLayer.classList.remove('show');
  tutorialLayer.classList.add('is-hiding');
  tutorialLayer.hidden=true;
  syncAmbientVolume();
  scheduleGrInvite(3000);
}
tutorialEnter?.addEventListener('click',event=>{
  event.preventDefault();
  playSceneTap();
  finishTutorial();
});
tutorialReplay?.addEventListener('click',event=>{
  event.preventDefault();
  event.stopPropagation();
  playTutorial();
});
try{
  if(localStorage.getItem('tutorial_finished')!=='true'){
    window.setTimeout(playTutorial,420);
  }else{
    scheduleGrInvite();
  }
}catch(e){
  window.setTimeout(playTutorial,420);
}
function triggerImpactJolt(){
  if(!sceneWrap||sceneWrap.classList.contains('is-leaving'))return;
  sceneWrap.classList.remove('impact-jolt');
  void sceneWrap.offsetWidth;
  sceneWrap.classList.add('impact-jolt');
  window.setTimeout(()=>sceneWrap.classList.remove('impact-jolt'),1850);
  try{
    if(!travelAudio||travelMuted||travelAudio.ctx.state!=='running')return;
    const ctx=travelAudio.ctx;
    const now=ctx.currentTime;
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    const filter=ctx.createBiquadFilter();
    osc.type='sine';
    osc.frequency.setValueAtTime(52,now);
    osc.frequency.exponentialRampToValueAtTime(36,now+.34);
    filter.type='lowpass';
    filter.frequency.value=120;
    gain.gain.setValueAtTime(.0001,now);
    gain.gain.exponentialRampToValueAtTime(.016,now+.05);
    gain.gain.exponentialRampToValueAtTime(.0001,now+.52);
    osc.connect(filter).connect(gain).connect(travelAudio.master);
    osc.start(now);
    osc.stop(now+.62);
  }catch(e){}
}
function scheduleImpactDrop(){
  const delay=10000+Math.random()*15000;
  window.setTimeout(()=>{
    const windows=document.querySelectorAll('.rain-window');
    const target=windows[Math.floor(Math.random()*windows.length)];
    if(target){
      const drop=document.createElement('i');
      drop.className='impact-drop';
      drop.style.left=`${18+Math.random()*64}%`;
      drop.style.top=`${8+Math.random()*42}%`;
      drop.style.height=`${34+Math.random()*32}px`;
      drop.style.opacity=`${.72+Math.random()*.18}`;
      target.appendChild(drop);
      triggerImpactJolt();
      window.setTimeout(()=>drop.remove(),8400);
    }
    scheduleImpactDrop();
  },delay);
}
scheduleImpactDrop();
soundToggle?.addEventListener('click',event=>{
  event.preventDefault();
  event.stopPropagation();
  ensureTravelAudio();
  setTravelMuted(!travelMuted);
  playSceneTap();
});
function openGrDrawer(event){
  openMusicianPanel(event);
}
function closeGrDrawer(event){
  event?.preventDefault();
  document.getElementById('grDrawer')?.classList.remove('open');
}
function sendGrWhisper(event){
  event.preventDefault();
  const input=event.currentTarget.elements.gr;
  const text=input.value.trim();
  if(!text)return;
  playSceneTap();
  document.getElementById('grLine').textContent='我收到了。等列车穿过下一段雨声，我会把这句话夹进信纸里。';
  input.value='';
}
document.querySelectorAll('a.hotspot').forEach(link=>{
  link.addEventListener('click',event=>{
    hideGrInvite();
    if(tutorialActive){event.preventDefault();return}
    if(event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;
    const href=link.getAttribute('href');
    if(!href||href==='#')return;
    if(link.matches('.hot-archive,.hot-write,.hot-events,.hot-letters,.hot-final')&&!selectedMusicianId()){
      openChoiceNotice(event);
      return;
    }
    event.preventDefault();
    playSceneTap();
    sceneWrap?.classList.add('is-leaving');
    window.setTimeout(()=>{window.location.href=href},190);
  });
});
musicianPanelClose?.addEventListener('click',closeMusicianPanel);
document.querySelector('.musician-panel')?.addEventListener('click',event=>event.stopPropagation());
musicianPanelLayer?.addEventListener('click',closeMusicianPanel);
choiceNoticeClose?.addEventListener('click',closeChoiceNotice);
choiceNoticeLayer?.querySelector('.musician-panel')?.addEventListener('click',event=>event.stopPropagation());
choiceNoticeLayer?.addEventListener('click',closeChoiceNotice);
choiceNoticeGoGr?.addEventListener('click',event=>{
  event.preventDefault();
  closeChoiceNotice();
  openMusicianPanel(event);
});
musicianChoiceList?.addEventListener('click',event=>{
  const link=event.target.closest('.musician-choice-enter');
  if(!link)return;
  try{localStorage.setItem('letterGameSelectedMusician',link.dataset.musician||'')}catch(e){}
  playSceneTap();
});
document.addEventListener('pointerdown',resetGrIdleInvite,{capture:true});
document.addEventListener('keydown',resetGrIdleInvite,{capture:true});
function handleSceneKeydown(event){
  if(event.key==='Escape'&&tutorialActive){
    event.preventDefault();
    finishTutorial();
    return;
  }
  if(event.key==='Escape'&&musicianPanelLayer?.classList.contains('open')){
    closeMusicianPanel(event);
    return;
  }
  if(event.key==='Escape'&&choiceNoticeLayer?.classList.contains('open')){
    closeChoiceNotice(event);
    return;
  }
  if(event.key==='Escape')closeGrDrawer(event);
}
document.addEventListener('keydown',handleSceneKeydown);
window.addEventListener('keydown',handleSceneKeydown);
</script>
</body>
</html>
