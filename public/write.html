<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音乐家私人书房 · 音乐信札</title>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap"></noscript>
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"></noscript>
<style>
:root{--gold:#c89a3a;--theme:#c89a3a;--paper:#ead7b7;--ink:#3b2815;--old-ink:#3d2a18;--serif:'Noto Serif SC','Songti SC','STSong',serif;--sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif;--mono:'IBM Plex Mono','SFMono-Regular',Menlo,monospace;--type:'Courier Prime','IBM Plex Mono','Songti SC','STSong',serif}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#060403;color:#ead8ad;font-family:var(--sans);overflow:hidden}
button,input{font:inherit}
button{touch-action:manipulation}
.study-room{position:relative;width:100vw;height:100vh;min-height:640px;isolation:isolate;overflow:hidden;background:#070503 url('assets/typewriter-dialog-template.png') center/cover no-repeat}
.study-room:before{content:'';position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse at 49% 37%,rgba(245,203,139,.07),transparent 34%),linear-gradient(90deg,rgba(0,0,0,.16),transparent 24%,transparent 70%,rgba(0,0,0,.42)),linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.27));pointer-events:none}
.study-room[data-bg="storm"]:before{background:radial-gradient(ellipse at 48% 38%,rgba(228,202,162,.06),transparent 33%),linear-gradient(100deg,rgba(24,31,41,.42),transparent 38%,rgba(0,0,0,.42)),linear-gradient(180deg,rgba(0,0,0,.16),rgba(0,0,0,.32))}
.study-room[data-bg="paris"]:before{background:radial-gradient(ellipse at 52% 38%,rgba(210,176,132,.08),transparent 35%),linear-gradient(110deg,rgba(42,28,42,.34),transparent 38%,rgba(0,0,0,.42)),linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.28))}
.back-cabin{position:absolute;z-index:8;left:2%;top:2%;height:30px;display:inline-flex;align-items:center;gap:6px;padding:0 11px;border:1px solid rgba(200,154,58,.34);border-radius:2px;background:rgba(8,6,4,.52);color:#e6cb8c;text-decoration:none;font-family:var(--serif);font-size:12px;letter-spacing:.08em;backdrop-filter:blur(2px)}
.back-cabin:hover,.back-cabin:focus-visible{outline:none;border-color:rgba(230,202,129,.72);color:#ffe6a6}
.profile-card{position:absolute;z-index:4;left:2.2%;top:5.2%;width:12%;min-width:132px;max-width:190px;color:#e7d09a;text-align:center;font-family:var(--serif)}
.profile-avatar{width:63%;aspect-ratio:1;margin:0 auto 11px;border:1px solid color-mix(in srgb,var(--theme) 76%,#fff 10%);border-radius:50%;background:#100b06 center 18%/cover no-repeat;box-shadow:0 0 0 1px rgba(0,0,0,.7),0 0 28px color-mix(in srgb,var(--theme) 22%,transparent);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;color:#e4c477;overflow:hidden}
.profile-name{font-size:clamp(18px,1.55vw,27px);font-weight:700;line-height:1.1;text-shadow:0 2px 14px #000}
.profile-era,.profile-topic{margin-top:6px;font-size:clamp(10px,.78vw,13px);line-height:1.45;color:#bda979;text-shadow:0 2px 12px #000}
.profile-topic{color:#ddc58d}
.memory-board{position:absolute;z-index:5;left:1.15%;top:22.2%;width:16%;min-width:176px;max-width:255px;aspect-ratio:436/962;border:0;background:transparent url('assets/chepiao.png') center/100% 100% no-repeat;filter:drop-shadow(0 18px 42px rgba(0,0,0,.30));font-family:var(--serif)}
.memory-title{display:none}
.ticket-list{position:absolute;inset:0;overflow:hidden}
.memory-ticket{position:absolute;left:15.4%;width:72.8%;height:8.6%;padding:0;border:0;background:transparent;color:#2b1d10;text-align:left;cursor:pointer}
.memory-ticket:nth-child(1){top:11.6%}
.memory-ticket:nth-child(2){top:24.1%}
.memory-ticket:nth-child(3){top:36.3%}
.memory-ticket:nth-child(4){top:48.5%}
.memory-ticket:nth-child(5){top:60.7%}
.memory-ticket:nth-child(6){top:72.8%}
.memory-ticket:nth-child(7){top:84.2%}
.memory-ticket:hover,.memory-ticket:focus-visible{outline:none}
.memory-ticket:hover .ticket-title,.memory-ticket:focus-visible .ticket-title{text-decoration:underline;text-underline-offset:2px}
.ticket-year{position:absolute;left:12%;right:10%;top:15%;display:block;font-family:Georgia,serif;font-size:clamp(9px,.73vw,13px);font-weight:700;line-height:1;color:rgba(30,20,10,.78);letter-spacing:.02em;text-shadow:0 1px rgba(255,235,185,.16);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticket-title{position:absolute;left:12%;right:10%;top:39%;display:block;font-size:clamp(7px,.52vw,9px);font-weight:700;line-height:1.12;color:rgba(24,16,8,.78);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticket-work{position:absolute;left:12%;right:10%;bottom:15%;display:block;font-family:var(--mono);font-size:clamp(6px,.40vw,7px);line-height:1.1;letter-spacing:.02em;color:rgba(32,22,12,.52);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.memory-ticket.locked{cursor:default;opacity:.62}
.memory-ticket.locked .ticket-work{opacity:.42}
.memory-more{position:absolute;left:25%;bottom:2.5%;width:51%;height:6.9%;border:0;background:transparent;color:transparent;cursor:pointer}
.memory-more:focus-visible{outline:1px solid rgba(230,202,129,.55);outline-offset:-4px}
.archive-drawer{position:absolute;z-index:16;left:18.2%;top:10%;width:min(360px,28vw);max-height:78vh;padding:20px 20px 18px;border:1px solid rgba(200,154,58,.34);background:linear-gradient(180deg,rgba(7,5,3,.92),rgba(9,7,5,.82));box-shadow:0 28px 70px rgba(0,0,0,.52),inset 0 0 0 1px rgba(255,232,174,.035);backdrop-filter:blur(8px);opacity:0;transform:translateX(-14px);pointer-events:none;transition:opacity .22s,transform .22s;font-family:var(--serif)}
.archive-drawer.open{opacity:1;transform:translateX(0);pointer-events:auto}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;color:#d6ad5c}
.drawer-head h2{margin:0;font-size:16px;letter-spacing:.08em;font-weight:600}
.drawer-close{width:28px;height:28px;border:1px solid rgba(200,154,58,.28);background:rgba(10,8,5,.42);color:#d6ad5c;cursor:pointer}
.drawer-close:hover,.drawer-close:focus-visible{outline:none;border-color:rgba(230,202,129,.72)}
.drawer-list{max-height:calc(78vh - 78px);overflow:auto;padding-right:6px;scrollbar-width:thin;scrollbar-color:rgba(200,154,58,.34) transparent}
.drawer-list::-webkit-scrollbar{width:4px}
.drawer-list::-webkit-scrollbar-thumb{background:rgba(200,154,58,.34);border-radius:99px}
.drawer-memory{width:100%;margin:0 0 10px;padding:10px 0 11px;border:0;border-bottom:1px solid rgba(200,154,58,.16);background:transparent;color:#d9c08a;text-align:left;cursor:pointer}
.drawer-memory:hover,.drawer-memory:focus-visible{outline:none;color:#f0d492}
.drawer-memory b{display:block;font-size:13px;line-height:1.35;color:inherit}
.drawer-memory span{display:block;margin-top:4px;font-family:var(--mono);font-size:10px;line-height:1.35;color:rgba(226,199,135,.58)}
.drawer-empty{margin:12px 0 0;font-size:13px;color:rgba(226,199,135,.62)}
.top-controls{position:absolute;z-index:6;right:4.2%;top:5.7%;display:flex;gap:10px;opacity:.78}
.round-tool{width:54px;height:54px;border:1px solid rgba(200,154,58,.36);border-radius:50%;background:rgba(7,5,3,.36);color:var(--theme);cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);transition:.18s}
.round-tool i{font-size:24px}
.round-tool:hover,.round-tool:focus-visible,.round-tool.on{outline:none;border-color:#f0d084;color:#f4d88f;box-shadow:0 0 20px color-mix(in srgb,var(--theme) 22%,transparent)}
.paper{position:absolute;z-index:3;left:33.2%;top:13.1%;width:43.3%;height:35.9%;padding:2.15% 3.05% 2.1%;color:var(--old-ink);font-family:var(--type);overflow:hidden;text-shadow:0 .4px rgba(255,255,255,.12)}
.paper:after{content:'';position:absolute;inset:6% 8%;z-index:-1;background:radial-gradient(circle at 24% 22%,rgba(72,42,18,.06),transparent 24%),radial-gradient(circle at 72% 67%,rgba(72,42,18,.045),transparent 28%),linear-gradient(92deg,transparent 0 48%,rgba(73,44,19,.035) 49%,transparent 50%);mix-blend-mode:multiply;pointer-events:none}
.paper-head{padding-bottom:9px;border-bottom:1px solid rgba(68,44,20,.10)}
.archive-line{font-family:var(--mono);font-size:clamp(10px,.78vw,12px);letter-spacing:.16em;text-transform:uppercase;color:rgba(61,42,24,.52);margin-bottom:8px}
.paper-title{font-family:var(--type);font-size:clamp(16px,1.22vw,21px);font-weight:700;line-height:1.22;color:rgba(49,29,12,.94);letter-spacing:.028em}
.paper-sub{margin-top:3px;font-family:var(--type);font-size:clamp(9px,.68vw,12px);line-height:1.36;color:rgba(55,33,14,.74);letter-spacing:.018em}
.paper-body{height:calc(100% - 64px);overflow:auto;padding:7px 8px 2px 0;scrollbar-width:thin;scrollbar-color:rgba(91,58,24,.36) transparent}
.paper-body::-webkit-scrollbar{width:4px}
.paper-body::-webkit-scrollbar-thumb{background:rgba(91,58,24,.35);border-radius:99px}
.archive-note{position:relative;margin:0 0 14px;padding:3px 0 8px 10px;border-left:1px solid rgba(87,57,26,.26);background:transparent;box-shadow:none}
.archive-note b{display:block;margin-bottom:6px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(63,39,14,.50)}
.archive-note h2{margin:0 34px 8px 0;font-family:var(--type);font-size:clamp(15px,1.05vw,19px);line-height:1.35;color:rgba(43,25,10,.94);letter-spacing:.018em}
.archive-note p{margin:0 0 9px;font-size:clamp(12px,.9vw,15px);line-height:1.78;color:rgba(48,29,12,.92);white-space:pre-wrap}
.archive-note .work{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:rgba(59,37,14,.58)}
.archive-close{position:absolute;right:8px;top:8px;width:26px;height:26px;border:0;background:transparent;color:rgba(45,28,11,.58);cursor:pointer}
.archive-close:hover,.archive-close:focus-visible{outline:none;color:#211306}
.letter-msg{position:relative;margin:0 0 12px;padding:0 0 0 4px;border-left:0;font-family:var(--type);font-size:clamp(13px,.94vw,16px);line-height:1.78;color:rgba(50,30,13,.94);letter-spacing:.016em;word-spacing:.035em}
.letter-msg:nth-of-type(3n){margin-left:5px}
.letter-msg:nth-of-type(4n){margin-left:-2px}
.letter-msg.user{margin-left:10%;color:rgba(42,25,11,.95)}
.letter-msg b{display:inline-block;margin:0 8px 0 0;font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:rgba(70,42,18,.58);vertical-align:baseline}
.letter-msg b:before{content:'['}
.letter-msg b:after{content:']'}
.letter-msg span{white-space:pre-wrap}
.type-target{white-space:pre-wrap}
.letter-msg.typing span:after{content:'';display:inline-block;width:7px;height:1.1em;margin-left:2px;border-right:1px solid rgba(58,37,17,.62);vertical-align:-2px;animation:caretBlink 1.05s steps(2,end) infinite}
.archive-note.typing .type-target:last-of-type:after{content:'';display:inline-block;width:7px;height:1.1em;margin-left:2px;border-right:1px solid rgba(58,37,17,.56);vertical-align:-2px;animation:caretBlink 1.05s steps(2,end) infinite}
.draft-line{margin:2px 0 0 10%;font-family:var(--type);font-size:clamp(13px,.92vw,16px);line-height:1.78;color:rgba(48,29,12,.72);letter-spacing:.018em;word-spacing:.035em;white-space:pre-wrap;min-height:1.78em}
.draft-line:before{content:'[你] ';font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:rgba(84,54,24,.34)}
.draft-line.active:after{content:'';display:inline-block;width:7px;height:1.1em;margin-left:2px;border-right:1px solid rgba(58,37,17,.44);vertical-align:-2px;animation:caretBlink 1.05s steps(2,end) infinite}
@keyframes caretBlink{50%{opacity:.18}}
.compose{position:absolute;z-index:6;left:31%;right:20%;bottom:5.7%;height:8.7%;display:grid;grid-template-columns:50px minmax(0,1fr) 48px;gap:8px;align-items:center}
.compose-icon{width:58px;height:58px;border:1px solid rgba(200,154,58,.34);border-radius:50%;background:rgba(7,5,3,.42);display:flex;align-items:center;justify-content:center;color:var(--theme);box-shadow:inset 0 0 18px rgba(255,224,160,.025)}
.compose-icon i{font-size:28px}
.compose input{height:36px;border:0;border-bottom:1px solid rgba(217,188,119,.10);border-radius:0;background:transparent;color:rgba(218,193,133,.66);caret-color:rgba(218,193,133,.42);padding:0 8px;outline:none;box-shadow:none;font-family:var(--type);font-size:13px;letter-spacing:.02em;text-shadow:0 2px 10px rgba(0,0,0,.66)}
.compose input::placeholder{color:rgba(218,193,133,.25)}
.compose input:focus{outline:none}
.return-lever{position:relative;width:48px;height:32px;border:1px solid rgba(200,154,58,.20);border-radius:2px;background:rgba(9,7,4,.36);color:rgba(225,196,126,.72);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 12px rgba(255,224,160,.018);transition:transform .18s,border-color .18s,color .18s,background .18s}
.return-lever i{font-size:18px}
.return-lever:after{content:''}
.return-lever:hover,.return-lever:focus-visible{outline:none;border-color:#e7c77e;color:#f4d88f}
.return-lever.sending{transform:translateX(-7px)}
.toast{position:absolute;z-index:20;left:50%;bottom:18%;transform:translate(-50%,12px);padding:9px 14px;border:1px solid rgba(200,154,58,.36);background:rgba(7,5,3,.78);color:#ead8ad;font-family:var(--serif);font-size:13px;opacity:0;pointer-events:none;transition:.22s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){
  html,body{overflow:auto}
  .study-room{width:100vw;height:auto;min-height:100vh;display:flex;flex-direction:column;gap:14px;padding:18px;background-image:linear-gradient(180deg,#14100c,#050403)}
  .back-cabin,.profile-card,.memory-board,.top-controls,.paper,.compose{position:relative;left:auto;right:auto;top:auto;bottom:auto;width:100%;max-width:none}
  .top-controls{justify-content:flex-end;order:-1;opacity:.86}
  .profile-card{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;text-align:left}
  .profile-avatar{width:76px;margin:0}
  .memory-board{height:auto;min-height:0;padding:12px}
  .memory-board{width:min(72vw,260px);aspect-ratio:436/962;padding:0}
  .archive-drawer{left:18px;right:18px;top:16vh;width:auto;max-height:70vh}
  .paper{height:50vh;min-height:390px;padding:24px;background:#ead7b7;border:1px solid rgba(200,154,58,.36);box-shadow:0 18px 60px rgba(0,0,0,.35)}
  .paper-body{height:calc(100% - 96px)}
  .compose{grid-template-columns:48px minmax(0,1fr) 56px;height:auto}
  .compose-icon{width:48px;height:48px}
  .return-lever{width:56px;height:42px}
}
</style>
</head>
<body>
<main class="study-room" id="studyRoom" data-bg="vienna" aria-label="音乐家私人书房">
  <a class="back-cabin" href="/letter-game"><i class="ti ti-arrow-left"></i>返回主车厢</a>

  <section class="profile-card" aria-label="当前音乐家档案">
    <div class="profile-avatar" id="profileAvatar"></div>
    <div>
      <div class="profile-name" id="profileName"></div>
      <div class="profile-era" id="profileEra"></div>
      <div class="profile-topic" id="profileTopic"></div>
    </div>
  </section>

  <section class="memory-board" aria-label="已解锁记忆碎片">
    <div class="memory-title"><i class="ti ti-train"></i><span>已解锁记忆碎片</span></div>
    <div class="ticket-list" id="ticketList"></div>
    <button class="memory-more" id="memoryMore" type="button" aria-label="更多档案">更多档案</button>
  </section>

  <aside class="archive-drawer" id="archiveDrawer" aria-label="更多记忆档案" aria-hidden="true">
    <div class="drawer-head">
      <h2>更多档案</h2>
      <button class="drawer-close" id="drawerClose" type="button" aria-label="关闭更多档案"><i class="ti ti-x"></i></button>
    </div>
    <div class="drawer-list" id="drawerList"></div>
  </aside>

  <div class="top-controls" aria-label="音乐与环境音">
    <button class="round-tool" id="musicToggle" type="button" aria-label="播放当前作品"><i class="ti ti-music"></i></button>
    <button class="round-tool" id="ambienceToggle" type="button" aria-label="切换环境音"><i class="ti ti-volume"></i></button>
  </div>

  <section class="paper" aria-label="打字机信纸">
    <div class="paper-head">
      <div class="archive-line" id="paperMeta"></div>
      <div class="paper-title" id="paperTitle"></div>
      <div class="paper-sub" id="paperSub"></div>
    </div>
    <div class="paper-body" id="paperBody"></div>
  </section>

  <form class="compose" id="composeForm">
    <div class="compose-icon" aria-hidden="true"><i class="ti ti-feather"></i></div>
    <input id="letterInput" autocomplete="off" placeholder="在打字机上写下你的问题...">
    <button class="return-lever" id="sendButton" type="submit" aria-label="发送"><i class="ti ti-corner-down-left"></i></button>
  </form>

  <div class="toast" id="toast"></div>
</main>

<script>
const musicianProfiles={
  mozart:{
    id:'mozart',
    name:'莫扎特',
    era:'1782 · 维也纳',
    location:'维也纳',
    avatar:'assets/mozart-avatar.png',
    topic:'婚姻与账单',
    currentYear:'1782',
    firstMeeting:'维也纳的夜雨刚停，剧院门口仍有马车声。他把账单压在乐谱下面，像压住一段不肯安静的旋律。',
    openingMessage:'我是莫扎特。今晚的维也纳太吵了，连账单都像在打拍子。你想先听一段序曲，还是先问我为什么总把生活写成喜歌？',
    currentMusic:'Die Entführung aus dem Serail, K.384 · Overture',
    musicSrc:'assets/mozart-audio-web/1782-serail.mp3',
    themeColor:'#d8a642',
    backgroundVariant:'vienna',
    memories:[
      {id:'k7',year:'1763',place:'巴黎',title:'神童的第一封回声',description:'他在陌生宫廷中把赞美听成节拍。',work:'Sonata in C major, K.7',grNote:'那一年，他还太小，不知道掌声也会成为一种债。Gr 在档案里记录：孩子用笑容回答世界，世界却已经开始向他索取奇迹。',unlocked:true},
      {id:'k310',year:'1778',place:'巴黎',title:'母亲离去后的夜晚',description:'巴黎的灯火没有照亮回程。',work:'Piano Sonata No.8, K.310',grNote:'这不是一次普通的旅行。失去让他的音符突然长出了阴影，也让轻快的手指第一次懂得沉默。',unlocked:true},
      {id:'idomeneo',year:'1781',place:'慕尼黑',title:'离开宫廷之前',description:'海浪、誓言与不肯屈服的年轻人。',work:'Idomeneo, K.366',grNote:'他已经听见自由在门外等候。可自由从不空手而来，它总带着账单、争执和更大的孤独。',unlocked:true},
      {id:'serail',year:'1782',place:'维也纳',title:'婚姻与逃离后宫',description:'爱情像喜歌，生活像催款单。',work:'Die Entführung aus dem Serail, K.384',grNote:'维也纳的夏天很亮。他结婚，也写喜歌，像要证明命运可以被轻快地唱过去。Gr 记下：他并非不知道危险，只是更愿意先写下旋律。',unlocked:true},

let currentProfile=null;
let activeMemoryId='';
let musicAudio=null;
let ambienceAudio=null;
let typingTimers=[];
let typeAudioContext=null;
let draftText='';
const room=document.getElementById('studyRoom');
const toastEl=document.getElementById('toast');

function esc(value){
  return String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}

function packText(value){
  return encodeURIComponent(String(value||''));
}

function unpackText(value){
  try{return decodeURIComponent(value||'')}catch(e){return value||''}
}

function selectedMusician(){
  const params=new URLSearchParams(location.search);
  const fromUrl=params.get('musician')||params.get('selected_musician');
  let stored='';
  try{stored=localStorage.getItem('letterGameSelectedMusician')||localStorage.getItem('selected_musician')||''}catch(e){}
  const id=fromUrl||stored||'mozart';
  return musicianProfiles[id]||musicianProfiles.mozart;
}

function chatKey(){
  return `typewriterChat:${currentProfile.id}`;
}

function loadMessages(){
  try{
    const saved=JSON.parse(localStorage.getItem(chatKey())||'[]');
    if(Array.isArray(saved)&&saved.length)return saved;
  }catch(e){}
  return [{role:'musician',name:currentProfile.name,text:currentProfile.openingMessage}];
}

function saveMessages(messages){
  try{localStorage.setItem(chatKey(),JSON.stringify(messages.slice(-36)))}catch(e){}
}

function showToast(text){
  toastEl.textContent=text;
  toastEl.classList.add('show');
  window.clearTimeout(showToast.timer);
  showToast.timer=window.setTimeout(()=>toastEl.classList.remove('show'),2200);
}

function orderedMemories(){
  return currentProfile.memories
    .map((memory,index)=>({...memory,index}))
    .sort((a,b)=>{
      const unlockedDelta=Number(b.unlocked)-Number(a.unlocked);
      if(unlockedDelta)return unlockedDelta;
      const recentDelta=Number(b.recent||false)-Number(a.recent||false);
      if(recentDelta)return recentDelta;
      const priorityDelta=(b.priority||0)-(a.priority||0);
      if(priorityDelta)return priorityDelta;
      return a.index-b.index;
    });
}

function workCode(work){
  const text=String(work||'');
  const match=text.match(/(?:K|Op|BWV|WoO)\.?\s*[\dA-Za-z.-]+(?:\s*No\.?\s*\d+)?/i);
  return match?match[0].replace(/\s+/g,' '):text.split(/[·,，]/).pop().trim();
}

function clearTyping(){
  typingTimers.forEach(timer=>window.clearTimeout(timer));
  typingTimers=[];
  document.querySelectorAll('.typing').forEach(el=>el.classList.remove('typing'));
}

function typeKeySound(){
  try{
    if(!typeAudioContext)typeAudioContext=new (window.AudioContext||window.webkitAudioContext)();
    if(typeAudioContext.state==='suspended')typeAudioContext.resume();
    const now=typeAudioContext.currentTime;
    const osc=typeAudioContext.createOscillator();
    const gain=typeAudioContext.createGain();
    const filter=typeAudioContext.createBiquadFilter();
    osc.type='square';
    osc.frequency.setValueAtTime(92+Math.random()*36,now);
    filter.type='lowpass';
    filter.frequency.setValueAtTime(720,now);
    gain.gain.setValueAtTime(0.0001,now);
    gain.gain.exponentialRampToValueAtTime(0.018,now+0.006);
    gain.gain.exponentialRampToValueAtTime(0.0001,now+0.045);
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(typeAudioContext.destination);
    osc.start(now);
    osc.stop(now+0.05);
  }catch(e){}
}

function typeInto(element,text,{sound=false,done}={}){
  element.textContent='';
  const chars=Array.from(text);
  let index=0;
  const step=()=>{
    element.textContent+=chars[index]||'';
    if(sound&&chars[index]&&chars[index].trim()&&index%2===0)typeKeySound();
    index+=1;
    const scroller=document.getElementById('paperBody');
    scroller.scrollTop=scroller.scrollHeight;
    if(index<chars.length){
      typingTimers.push(window.setTimeout(step,22+Math.random()*42));
    }else if(done){
      done();
    }
  };
  typingTimers.push(window.setTimeout(step,80));
}

function typeSequence(targets,{sound=false}={}){
  if(!targets.length)return;
  const [first,...rest]=targets;
  const wrapper=first.closest('.letter-msg,.archive-note');
  wrapper?.classList.add('typing');
  typeInto(first,unpackText(first.dataset.full),{
    sound,
    done:()=>{
      wrapper?.classList.remove('typing');
      typeSequence(rest,{sound});
    }
  });
}

function renderTickets(){
  const list=document.getElementById('ticketList');
  list.innerHTML=orderedMemories().slice(0,7).map(memory=>{
    const locked=!memory.unlocked;
    return `<button class="memory-ticket ${locked?'locked':''}" type="button" data-memory="${esc(memory.id)}" ${locked?'aria-disabled="true"':''}>
      <span class="ticket-year">${esc(memory.year)}</span>
      <span class="ticket-title">${esc(locked?'UNKNOWN':memory.title)}</span>
      <span class="ticket-work">${esc(workCode(memory.work))}</span>
    </button>`;
  }).join('');
}

function renderDrawer(){
  const unlocked=currentProfile.memories.filter(memory=>memory.unlocked);
  document.getElementById('drawerList').innerHTML=unlocked.length?unlocked.map(memory=>`<button class="drawer-memory" type="button" data-memory="${esc(memory.id)}">
    <b>${esc(memory.year)} · ${esc(memory.place||currentProfile.location)} · ${esc(memory.title)}</b>
    <span>${esc(memory.work)}</span>
  </button>`).join(''):'<p class="drawer-empty">还没有已解锁的更多档案。</p>';
}

function setDrawer(open){
  const drawer=document.getElementById('archiveDrawer');
  drawer.classList.toggle('open',open);
  drawer.setAttribute('aria-hidden',open?'false':'true');
}

function renderPaper(options={}){
  clearTyping();
  document.getElementById('paperMeta').textContent=`Private Study · ${currentProfile.currentYear} · ${currentProfile.location}`;
  document.getElementById('paperTitle').textContent=`致 ${currentProfile.name} 的通信`;
  document.getElementById('paperSub').textContent=`${currentProfile.era} · ${currentProfile.topic} · 当前作品：${currentProfile.currentMusic}`;

  const messages=loadMessages();
  const active=currentProfile.memories.find(memory=>memory.id===activeMemoryId&&memory.unlocked);
  const archiveHtml=active?`<aside class="archive-note" aria-label="Gr档案记录">
    <button class="archive-close" type="button" id="archiveClose" aria-label="关闭档案"><i class="ti ti-x"></i></button>
    <b>Gr档案记录 · ${esc(active.year)} · ${esc(active.place)}</b>
    <h2 class="type-target ${options.animateArchive?'pending-type':''}" ${options.animateArchive?`data-full="${packText(active.title)}"`:''}>${options.animateArchive?'':esc(active.title)}</h2>
    <p class="type-target ${options.animateArchive?'pending-type':''}" ${options.animateArchive?`data-full="${packText(active.grNote)}"`:''}>${options.animateArchive?'':esc(active.grNote)}</p>
    <div class="work">对应作品 · ${esc(active.work)}</div>
  </aside>`:'';
  const animateFrom=Number.isInteger(options.animateFrom)?options.animateFrom:messages.length;
  const chatHtml=messages.map((message,index)=>{
    const shouldType=options.animateMessages&&index>=animateFrom;
    return `<div class="letter-msg ${message.role==='user'?'user':'musician'} ${shouldType?'typing':''}">
    <b>${esc(message.role==='user'?'你':message.name||currentProfile.name)}</b>
    <span class="type-target" ${shouldType?`data-full="${packText(message.text)}"`:''}>${shouldType?'':esc(message.text)}</span>
  </div>`;
  }).join('');
  const draftHtml=`<div class="draft-line ${draftText?'active':''}" id="paperDraft">${esc(draftText)}</div>`;
  const body=document.getElementById('paperBody');
  body.innerHTML=archiveHtml+chatHtml+draftHtml;
  const targets=[...body.querySelectorAll('.pending-type,.letter-msg.typing .type-target')];
  if(targets.length){
    typeSequence(targets,{sound:!!options.sound});
  }else if(!active){
    body.scrollTop=body.scrollHeight;
  }
}

function applyProfile(profile){
  currentProfile=profile;
  activeMemoryId='';
  document.title=`${profile.name} · 音乐家私人书房`;
  room.style.setProperty('--theme',profile.themeColor||'#c89a3a');
  room.dataset.bg=profile.backgroundVariant||'vienna';
  const avatar=document.getElementById('profileAvatar');
  avatar.textContent=profile.avatar?'':profile.name.slice(0,1);
  avatar.style.backgroundImage=profile.avatar?`url('${profile.avatar}')`:'none';
  document.getElementById('profileName').textContent=profile.name;
  document.getElementById('profileEra').textContent=profile.era;
  document.getElementById('profileTopic').textContent=`当前话题：${profile.topic}`;
  try{
    localStorage.setItem('letterGameSelectedMusician',profile.id);
    localStorage.setItem('selected_musician',profile.id);
  }catch(e){}
  renderTickets();
  renderDrawer();
  renderPaper({animateMessages:true,animateFrom:0,sound:false});
}

document.getElementById('ticketList').addEventListener('click',event=>{
  const ticket=event.target.closest('.memory-ticket');
  if(!ticket)return;
  const memory=currentProfile.memories.find(item=>item.id===ticket.dataset.memory);
  if(!memory)return;
  if(!memory.unlocked){
    showToast('这张记忆车票还没有解封');
    return;
  }
  activeMemoryId=memory.id;
  renderPaper({animateArchive:true,sound:true});
});

document.getElementById('memoryMore').addEventListener('click',()=>{
  renderDrawer();
  setDrawer(true);
});

document.getElementById('drawerClose').addEventListener('click',()=>setDrawer(false));

document.getElementById('archiveDrawer').addEventListener('click',event=>{
  const item=event.target.closest('.drawer-memory');
  if(!item)return;
  const memory=currentProfile.memories.find(entry=>entry.id===item.dataset.memory);
  if(!memory)return;
  activeMemoryId=memory.id;
  setDrawer(false);
  renderPaper({animateArchive:true,sound:true});
});

document.addEventListener('keydown',event=>{
  if(event.key==='Escape')setDrawer(false);
});

document.getElementById('paperBody').addEventListener('click',event=>{
  if(event.target.closest('#archiveClose')){
    activeMemoryId='';
    renderPaper();
  }
});

document.getElementById('composeForm').addEventListener('submit',event=>{
  event.preventDefault();
  const input=document.getElementById('letterInput');
  const text=(draftText||input.value).trim();
  if(!text)return;
  const sendButton=document.getElementById('sendButton');
  sendButton.classList.add('sending');
  window.setTimeout(()=>sendButton.classList.remove('sending'),210);
  const messages=loadMessages();
  messages.push({role:'user',text});
  messages.push({role:'musician',name:currentProfile.name,text:`我听见了。\n关于“${text.slice(0,28)}”，让我们先把它夹进${currentProfile.currentYear}年的信纸里。`});
  saveMessages(messages);
  input.value='';
  draftText='';
  renderPaper({animateMessages:true,animateFrom:messages.length-2,sound:true});
});

document.getElementById('letterInput').addEventListener('keydown',event=>{
  if(event.key==='Enter'&&!event.shiftKey){
    event.preventDefault();
    document.getElementById('composeForm').requestSubmit();
  }
});

document.getElementById('letterInput').addEventListener('input',event=>{
  draftText=event.target.value;
  renderPaper();
});

document.getElementById('paperBody').addEventListener('click',()=>{
  document.getElementById('letterInput').focus();
});

document.getElementById('musicToggle').addEventListener('click',event=>{
  const button=event.currentTarget;
  if(!currentProfile.musicSrc){showToast('这首作品的音源还在整理中');return}
  if(!musicAudio)musicAudio=new Audio(currentProfile.musicSrc);
  musicAudio.volume=.22;
  if(musicAudio.paused){musicAudio.play().catch(()=>showToast('请再点一次播放'));button.classList.add('on')}
  else{musicAudio.pause();button.classList.remove('on')}
});

document.getElementById('ambienceToggle').addEventListener('click',event=>{
  const button=event.currentTarget;
  if(!ambienceAudio&&currentProfile.musicSrc){
    ambienceAudio=new Audio(currentProfile.musicSrc);
    ambienceAudio.volume=.05;
    ambienceAudio.loop=true;
  }
  if(!ambienceAudio){showToast('环境音稍后接入');return}
  if(ambienceAudio.paused){ambienceAudio.play().catch(()=>showToast('请再点一次开启环境音'));button.classList.add('on')}
  else{ambienceAudio.pause();button.classList.remove('on')}
});

applyProfile(selectedMusician());
</script>
