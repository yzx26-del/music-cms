<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时空档案袋 · 莫扎特</title>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap"></noscript>
<style>
:root{
  --design-w:1536;
  --design-h:1024;
  --scale:1;
  --serif:'Noto Serif SC','Songti SC','STSong',serif;
  --mono:'IBM Plex Mono','SFMono-Regular',Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#18110a;color:#3a2412;font-family:var(--serif)}
body{overflow:hidden}
.archive-viewport{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#18110a;
}
.archive-stage-wrap{
  width:calc(var(--design-w) * 1px * var(--scale));
  height:calc(var(--design-h) * 1px * var(--scale));
  flex:0 0 auto;
}
.archive-stage{
  position:relative;
  width:calc(var(--design-w) * 1px);
  height:calc(var(--design-h) * 1px);
  transform:scale(var(--scale));
  transform-origin:top left;
  overflow:hidden;
  background:#21150b;
  box-shadow:0 30px 110px rgba(0,0,0,.38);
}
.archive-template{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;pointer-events:none}
.hit{position:absolute;border:0;background:transparent;padding:0;cursor:pointer}
.hit:focus-visible{outline:2px solid rgba(209,154,70,.86);outline-offset:2px}
.ticket-hit{top:374px;width:196px;height:205px}.ticket-0{left:132px}.ticket-1{left:355px}.ticket-2{left:575px}.ticket-3{left:764px}.ticket-4{left:980px}
.branch-hit{top:640px;width:128px;height:108px}.branch-0{left:139px}.branch-1{left:270px}.branch-2{left:399px}.branch-3{left:527px}
.collection-hit{top:642px;width:100px;height:108px}.collection-0{left:719px}.collection-1{left:825px}.collection-2{left:932px}.collection-3{left:1038px}
.final-hit{left:1197px;top:52px;width:282px;height:239px}.message-hit{left:850px;top:804px;width:296px;height:164px}.back-hit{left:94px;top:969px;width:174px;height:39px}
.select-glow{
  position:absolute;
  width:204px;
  height:213px;
  border-radius:6px;
  pointer-events:none;
  background:linear-gradient(115deg,rgba(255,229,151,.08),rgba(255,196,92,.24) 45%,rgba(255,244,184,.12));
  box-shadow:0 0 24px rgba(240,181,78,.32),inset 0 0 22px rgba(255,226,135,.23);
  mix-blend-mode:screen;
  transition:left .22s ease,top .22s ease,opacity .18s ease;
}
.locked-dim{
  position:absolute;
  left:978px;
  top:374px;
  width:197px;
  height:205px;
  border-radius:5px;
  background:rgba(20,14,8,.18);
  pointer-events:none;
}
.replace{
  position:absolute;
  overflow:hidden;
  color:#352111;
  text-shadow:0 1px rgba(255,231,180,.22);
  pointer-events:none;
}
.replace.dark{color:#c99650;text-shadow:0 1px rgba(0,0,0,.72)}
.patch-paper{background:rgba(202,173,125,.88);box-shadow:inset 0 0 18px rgba(92,55,23,.12)}
.patch-wood{background:rgba(36,25,14,.82);box-shadow:inset 0 0 16px rgba(0,0,0,.16)}
.r-progress{left:1112px;top:168px;width:70px;height:36px;text-align:center;font-size:28px;line-height:36px}
.r-stability{left:1390px;top:352px;width:58px;height:36px;text-align:right;font-size:28px;line-height:36px}
.r-relation{left:1221px;top:549px;width:90px;height:32px;font-size:24px;line-height:32px}
.r-collection{left:1342px;top:743px;width:86px;height:60px;text-align:center;font-size:30px;line-height:60px;border-radius:50%}
.r-shift{left:91px;top:881px;width:111px;height:44px;text-align:center;font-size:30px;line-height:44px}
.r-message{left:893px;top:836px;width:222px;height:64px;padding:4px 8px;font-size:16px;line-height:1.65}
.r-ticket-state{left:785px;top:546px;width:92px;height:22px;font-size:14px;line-height:22px}
.node-label{position:absolute;left:857px;top:793px;width:260px;height:22px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:#c8944a;text-align:right;text-shadow:0 1px rgba(0,0,0,.6);pointer-events:none}
.archive-dialog{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(36,23,12,.18)}
.archive-dialog.show{display:flex}
.dialog-paper{
  width:390px;
  min-height:170px;
  padding:26px 30px 24px;
  background:#cdb180;
  color:#2f1e10;
  border:1px solid rgba(88,55,25,.36);
  box-shadow:0 24px 70px rgba(0,0,0,.32),inset 0 0 24px rgba(95,57,25,.13);
}
.dialog-paper h2{margin:0 0 12px;font-size:22px;font-weight:600}
.dialog-paper p{margin:0;font-size:16px;line-height:1.8}
.dialog-paper button{margin-top:18px;border:1px solid rgba(83,52,24,.45);background:rgba(64,39,16,.12);color:#2d1c0e;font-family:var(--serif);font-size:15px;padding:7px 18px;cursor:pointer}
.mobile-note{display:none}
@media(max-width:760px){
  body{overflow:auto}
  .archive-viewport{align-items:flex-start;justify-content:flex-start}
  .mobile-note{display:block;position:fixed;left:12px;right:12px;bottom:12px;z-index:5;padding:10px 12px;background:rgba(38,25,13,.86);color:#d6b174;font-size:13px;line-height:1.5}
}
</style>
</head>
<body>
<main class="archive-viewport" aria-label="时空档案袋">
  <div class="archive-stage-wrap">
    <section class="archive-stage" id="archiveStage">
      <img class="archive-template" src="assets/archive-hub-afternoon-template.png" alt="莫扎特人物档案工作台母版">
      <div class="select-glow" id="selectGlow"></div>
      <div class="locked-dim"></div>
      <a class="hit back-hit" href="/letter-game" aria-label="返回 GR 小姐聊天"></a>
      <button class="hit final-hit" id="finalButton" type="button" aria-label="人物终章"></button>
      <button class="hit message-hit" id="messageButton" type="button" aria-label="查看信件"></button>
      <div id="ticketHits"></div>
      <div id="branchHits"></div>
      <div id="collectionHits"></div>
      <div class="replace dark patch-wood r-progress" id="progressValue"></div>
      <div class="replace patch-paper r-stability" id="stabilityValue"></div>
      <div class="replace patch-paper r-relation" id="relationValue"></div>
      <div class="replace patch-paper r-collection" id="collectionValue"></div>
      <div class="replace dark patch-wood r-shift" id="shiftValue"></div>
      <div class="replace dark patch-wood r-message" id="messageValue"></div>
      <div class="replace r-ticket-state" id="ticketState"></div>
      <div class="node-label" id="nodeLabel"></div>
      <div class="archive-dialog" id="archiveDialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
        <div class="dialog-paper">
          <h2 id="dialogTitle"></h2>
          <p id="dialogBody"></p>
          <button type="button" id="dialogClose">收起</button>
        </div>
      </div>
    </section>
  </div>
  <div class="mobile-note">建议横屏查看。当前档案母版会保持原比例，不重新排版。</div>
</main>
<script type="module">
import { mozartArchive } from './data/mozartArchive.js';

const DESIGN_W = 1536;
const DESIGN_H = 1024;
const data = mozartArchive;
const ticketPositions = [
  { left: 128, top: 371 },
  { left: 351, top: 371 },
  { left: 571, top: 371 },
  { left: 760, top: 371 },
  { left: 976, top: 371 }
];
let selectedTicketId = data.mainProgress.currentYear
  ? data.mainTickets.find(ticket => ticket.year === data.mainProgress.currentYear)?.id
  : data.mainTickets[0]?.id;

const root = document.documentElement;
const ticketHits = document.getElementById('ticketHits');
const branchHits = document.getElementById('branchHits');
const collectionHits = document.getElementById('collectionHits');
const selectGlow = document.getElementById('selectGlow');
const progressValue = document.getElementById('progressValue');
const stabilityValue = document.getElementById('stabilityValue');
const relationValue = document.getElementById('relationValue');
const collectionValue = document.getElementById('collectionValue');
const shiftValue = document.getElementById('shiftValue');
const messageValue = document.getElementById('messageValue');
const ticketState = document.getElementById('ticketState');
const nodeLabel = document.getElementById('nodeLabel');
const dialog = document.getElementById('archiveDialog');
const dialogTitle = document.getElementById('dialogTitle');
const dialogBody = document.getElementById('dialogBody');

function resizeStage(){
  const scale = Math.min(window.innerWidth / DESIGN_W, window.innerHeight / DESIGN_H, 1);
  root.style.setProperty('--scale', String(Math.max(scale, 0.2)));
}
function showDialog(title, body){
  dialogTitle.textContent = title;
  dialogBody.textContent = body;
  dialog.classList.add('show');
}
function activeTicket(){
  return data.mainTickets.find(ticket => ticket.id === selectedTicketId) || data.mainTickets[0];
}
function renderHits(){
  ticketHits.innerHTML = data.mainTickets.map((ticket, index) => (
    `<button class="hit ticket-hit ticket-${index}" type="button" data-ticket="${ticket.id}" aria-label="${ticket.year} ${ticket.title}"></button>`
  )).join('');
  branchHits.innerHTML = data.branchTickets.map((ticket, index) => (
    `<button class="hit branch-hit branch-${index}" type="button" data-branch="${ticket.id}" aria-label="${ticket.title} ${ticket.status}"></button>`
  )).join('');
  collectionHits.innerHTML = data.collections.items.map((item, index) => (
    `<button class="hit collection-hit collection-${index}" type="button" data-collection="${item.id}" aria-label="${item.title}"></button>`
  )).join('');

  ticketHits.querySelectorAll('[data-ticket]').forEach(button => {
    button.addEventListener('click', () => {
      const ticket = data.mainTickets.find(item => item.id === button.dataset.ticket);
      if (!ticket || ticket.status === '未抵达') {
        showDialog('未抵达', '这张车票尚未抵达。请先完成前面的主线车票。');
        return;
      }
      selectedTicketId = ticket.id;
      renderState();
    });
  });
  branchHits.querySelectorAll('[data-branch]').forEach(button => {
    button.addEventListener('click', () => showDialog('支线车票', '支线档案尚未解锁。它不会影响主线抵达，但会影响收藏室与人物终章。'));
  });
  collectionHits.querySelectorAll('[data-collection]').forEach(button => {
    const item = data.collections.items.find(entry => entry.id === button.dataset.collection);
    button.addEventListener('click', () => showDialog('收藏室', `${item?.title || '藏品'}：被时间留下的东西，暂时只登记在这张档案桌上。`));
  });
}
function renderState(){
  const ticket = activeTicket();
  const index = Math.max(0, data.mainTickets.findIndex(item => item.id === ticket.id));
  const pos = ticketPositions[index] || ticketPositions[0];
  selectGlow.style.left = `${pos.left}px`;
  selectGlow.style.top = `${pos.top}px`;
  progressValue.textContent = `${data.mainProgress.completed} / ${data.mainProgress.total}`;
  stabilityValue.textContent = `${data.timelineStability.value}%`;
  relationValue.textContent = data.relationship.stage;
  collectionValue.textContent = `${Math.round(data.collections.unlocked / data.collections.total * 100)}%`;
  shiftValue.textContent = data.temporalShift.value;
  messageValue.textContent = data.messages.latest.text;
  ticketState.textContent = ticket.status;
  nodeLabel.textContent = `当前节点 · ${ticket.year} · ${ticket.title}`;
}

document.getElementById('finalButton').addEventListener('click', () => {
  showDialog(data.finalChapter.title, `${data.finalChapter.status}。${data.finalChapter.condition}`);
});
document.getElementById('messageButton').addEventListener('click', () => {
  showDialog('来自他的消息', `${data.messages.latest.date}：${data.messages.latest.text}`);
});
document.getElementById('dialogClose').addEventListener('click', () => dialog.classList.remove('show'));
dialog.addEventListener('click', event => {
  if (event.target === dialog) dialog.classList.remove('show');
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') dialog.classList.remove('show');
});
window.addEventListener('resize', resizeStage);

resizeStage();
renderHits();
renderState();
</script>
</body>
</html>
